<div class="mx-auto w-full">
  <div class="bg-aldy-bold text-base sm:text-lg">
    <div
      class="w-full relative mx-auto py-6 sm:py-8 md:py-10 px-2 min-[320px]:px-3 sm:px-4 md:px-6 grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-4 gap-3 min-[320px]:gap-4 sm:gap-6 md:gap-8 text-center">
      <div class="absolute inset-0 flex justify-center items-center pointer-events-none select-none z-0">
        <img src="../../../../../assets/svg/logo.svg" alt="Aldana Vilcabana"
          class="w-[200px] sm:w-[260px] opacity-20 object-contain" draggable="false" />
      </div>
      <!-- LOGO Y REDES -->
      <div>
        <div class="flex justify-center items-center mb-4">
          <img src="../../../../../assets/svg/logos-full-white.svg" alt="Aldana Vilcabana"
            class="w-36 sm:w-40 md:w-48 h-auto object-contain">
        </div>
        <h3
          class="NewAldyTitle text-aldy-light font-light mb-3 sm:mb-4 tracking-normal min-[320px]:tracking-wide sm:tracking-wider text-sm min-[320px]:text-base sm:text-base">
          Síguenos
        </h3>
        <div
          class="flex justify-center space-x-3 min-[320px]:space-x-5 sm:space-x-7 text-base min-[320px]:text-lg sm:text-xl md:text-2xl">
          <a href="#" aria-label="Instagram" class="hover:text-aldy-medium text-white  transition"><i
              class="fab fa-instagram"></i></a>
          <a href="#" aria-label="Facebook" class="hover:text-aldy-medium text-white  transition"><i
              class="fab fa-facebook-f"></i></a>
          <a href="#" aria-label="Pinterest" class="hover:text-aldy-medium text-white  transition"><i
              class="fab fa-pinterest-p"></i></a>
          <a href="#" aria-label="Twitter" class="hover:text-aldy-medium text-white  transition"><i
              class="fab fa-twitter"></i></a>
        </div>
      </div>

      <!-- TIENDA -->
      <div>
        <h3
          class="NewAldyTitle text-aldy-light font-light mb-3 sm:mb-4 tracking-normal min-[320px]:tracking-wide sm:tracking-wider text-sm min-[320px]:text-base sm:text-base">
          Tienda
        </h3>
        <ul class="space-y-1.5 sm:space-y-2 font-main text-sm min-[320px]:text-base sm:text-base md:text-lg">
          <li *ngFor="let item of tiendaItems">
            <a [routerLink]="['/tienda']" [queryParams]="{ categoria: normalizeCategory(item) }"
              class="hover:text-aldy-medium NewAldyFontType4 text-sm tracking-wide text-white transition">
              {{ item }}
            </a>
          </li>
        </ul>
      </div>

      <!-- CONÓCENOS -->
      <div>
        <h3
          class="NewAldyTitle text-aldy-light font-light mb-3 sm:mb-4 tracking-normal min-[320px]:tracking-wide sm:tracking-wider text-sm min-[320px]:text-base sm:text-base">
          Conócenos
        </h3>
        <ul class="space-y-1.5 sm:space-y-2 font-main text-sm min-[320px]:text-base sm:text-base md:text-lg">
          <li><a routerLink="/acerca-de-mi" class="hover:text-aldy-medium NewAldyFontType4 text-sm tracking-wide text-white transition">Acerca de mí</a></li>
          <li><a routerLink="/colecciones" class="hover:text-aldy-medium NewAldyFontType4 text-sm tracking-wide text-white transition">Galería</a></li>
        </ul>
      </div>

      <!-- NOVIAS -->
      <div>
        <h3
          class="NewAldyTitle text-aldy-light font-light mb-3 sm:mb-4 tracking-normal min-[320px]:tracking-wide sm:tracking-wider text-sm min-[320px]:text-base sm:text-base">
          Novias
        </h3>
        <ul class="space-y-1.5 sm:space-y-2 font-main text-sm min-[320px]:text-base sm:text-base md:text-lg">
          <li><a routerLink="/novias-colecciones/jardin-secreto" class="hover:text-aldy-medium NewAldyFontType4 text-sm tracking-wide text-white transition">Jardin secreto</a></li>
        </ul>
      </div>
    </div>
    <div
      class="text-white bg-aldy-bold-2 py-4 sm:py-4 text-center text-xs sm:text-xs px-2 min-[320px]:px-3 sm:px-4 md:px-6">
      © {{ 2025 }} Aldana Vilcabana todos los derechos reservados.
    </div>

  </div>
</div>
