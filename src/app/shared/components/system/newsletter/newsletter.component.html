<div class="w-full py-18 md:py-30 px-4">
  <div class="max-w-6xl mx-auto">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-20 xl:gap-24 items-center">
      <div class="flex justify-center lg:justify-end order-1">
        <div class="relative flex justify-center items-center">
          <div class="grid grid-cols-2 gap-3 sm:gap-4 my-auto">
            <div
              class="w-38 sm:w-55 md:w-55 lg:w-64 aspect-[4/5] bg-gradient-to-br shadow-2xl -rotate-8 transform overflow-hidden z-20 md:z-10">
              <img appCardInitAnimation="down" [draggable]="false"
                src="https://cddrmboopihkiuyomxle.supabase.co/storage/v1/object/public/aldana-app/multimedia/about%20me/section-photos/preview/preview_4.jpg"
                alt="Fashion style" class="w-full h-full object-cover object-top" />
            </div>
            <div
              class="w-38 sm:w-55 md:w-55 lg:w-64 aspect-[4/5] bg-gradient-to-br shadow-2xl rotate-8 transform overflow-hidden z-10 md:z-20">
              <img appCardInitAnimation="up" [draggable]="false"
                src="https://cddrmboopihkiuyomxle.supabase.co/storage/v1/object/public/aldana-app/products/vestidos/vestido_gladiolo/1752718247389.jpg"
                alt="Style inspiration" class="w-full h-full object-cover object-top" />
            </div>
          </div>
        </div>
      </div>
      <div class="flex flex-col justify-center space-y-6 lg:space-y-8 order-2 lg:pl-8 xl:pl-12">
        <div class="text-center lg:text-left">
          <h2
            appWordReveal class="text-4xl sm:text-5xl lg:text-4xl xl:text-5xl timesRoman font-normal text-gray-900 leading-tight mb-6">
            Newsletter
          </h2>
          <p
            appFadeUpLetter class="text-gray-600 font-aldy text-base sm:text-lg lg:text-base xl:text-lg font-normal leading-relaxed max-w-md mx-auto lg:mx-0 lg:max-w-sm xl:max-w-md">
            Descubre las creaciones de Aldana Vilcabana y suscríbete a nuestro newsletter para estar al día con
            novedades, lanzamientos y tips de estilo.
          </p>
        </div>
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <div class="relative w-full max-w-lg mx-auto lg:mx-0 lg:max-w-sm xl:max-w-lg">
            <input appFadeUpLetter type="email" placeholder="Ingresa tu correo aqui" formControlName="email"
              class="w-full p-3 md:p-5 lg:p-7 pr-12 border border-gray-500 focus:border-transparent shadow-sm focus:outline-none transition-all duration-300 ease-in-out focus:ring-2 focus:ring-aldy-primary-400" />
            <button type="submit">
              <lucide-icon
                class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-600 cursor-pointer block md:hidden"
                name="send" [size]="24" [strokeWidth]="1.2">
              </lucide-icon>
              <lucide-icon
                class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-600 cursor-pointer hidden md:block"
                name="send" [size]="30" [strokeWidth]="1.2">
              </lucide-icon>
            </button>
          </div>
          <div *ngIf="submitted && email?.invalid" class="text-red-400 text-sm mt-1 text-center lg:text-left">
            <span *ngIf="email?.errors?.['email']">Por favor ingrese un correo válido.</span>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
