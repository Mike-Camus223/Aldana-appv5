@if (!isMobileView) {
<aside class="transition-all duration-300 ease-in-out overflow-hidden shrink-0"
  [ngStyle]="{
    width: showFilters ? '240px' : '0px',
    opacity: showFilters ? '1' : '0',
    marginRight: showFilters ? '2rem' : '0px',
    pointerEvents: showFilters ? 'auto' : 'none'
  }">
  <div class="w-[240px] pr-3 self-start">
    <ul class="space-y-4">
      @for (opt of options; track opt.value) {
        <li>
          <button
            (click)="selectCategory(opt.value)"
            class="relative w-full text-left text-xs tracking-[0.2em] uppercase font-light py-2 pl-4 transition-colors duration-300 ease-in-out cursor-pointer hover:text-aldy-medium NewAldyFontType4"
            [ngClass]="activeCategory === opt.value ? 'text-aldy-medium font-semibold' : 'text-aldy-green-gray-bold'">
            <span #indicator
                  class="absolute left-0 top-1/4 bottom-1/4 w-[2px] bg-aldy-medium origin-center opacity-0 scale-y-0"
                  [attr.data-value]="opt.value"></span>
            {{ opt.label }}
          </button>
        </li>
      }
    </ul>
  </div>
</aside>
}

@if (isMobileView) {
<!-- Mobile Slide-in Sidebar -->
<div class="fixed inset-0 z-50 flex pointer-events-none transition-all duration-300"
  [ngClass]="{
    'opacity-100': showFilters,
    'opacity-0 pointer-events-none': !showFilters
  }">
  <!-- Backdrop overlay con blur-md para difuminar los productos de fondo -->
  <div class="fixed inset-0 bg-black/30 backdrop-blur-md transition-opacity duration-300"
    [ngClass]="showFilters ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'"
    (click)="toggleFilters()">
  </div>

  <!-- Sidebar con fondo sólido bg-aldy-white ajustado al tamaño de las opciones -->
  <div class="relative w-64 max-w-[75vw] bg-aldy-white border-r border-[#d9e2d8] shadow-2xl h-full flex flex-col transition-transform duration-300 ease-out z-10"
    [ngClass]="showFilters ? 'translate-x-0 pointer-events-auto' : '-translate-x-full pointer-events-none'"
    (click)="$event.stopPropagation()">
    
    <!-- Encabezado del Sidebar -->
    <div class="p-5 border-b border-[#d9e2d8] flex items-center justify-between">
      <span class="text-xs tracking-[0.25em] uppercase font-medium text-aldy-green-gray-bold NewAldyFontType4">
        Categorías
      </span>
      <button type="button" (click)="toggleFilters()"
        class="p-2 -mr-2 text-aldy-green-gray-bold hover:text-aldy-medium transition-colors cursor-pointer"
        aria-label="Cerrar filtros">
        <lucide-icon name="Plus" class="h-4 w-4 rotate-45"></lucide-icon>
      </button>
    </div>

    <!-- Lista de Categorías ajustada al ancho del sidebar -->
    <div class="p-5 flex-1 overflow-y-auto">
      <ul class="space-y-4">
        @for (opt of options; track opt.value) {
          <li>
            <button
              (click)="selectCategory(opt.value)"
              class="relative w-full text-left text-xs tracking-[0.2em] uppercase font-light py-2 pl-4 transition-colors duration-300 ease-in-out cursor-pointer hover:text-aldy-medium NewAldyFontType4"
              [ngClass]="activeCategory === opt.value ? 'text-aldy-medium font-semibold' : 'text-aldy-green-gray-bold'">
              <span #indicator
                    class="absolute left-0 top-1/4 bottom-1/4 w-[2px] bg-aldy-medium origin-center opacity-0 scale-y-0"
                    [attr.data-value]="opt.value"></span>
              {{ opt.label }}
            </button>
          </li>
        }
      </ul>
    </div>
  </div>
</div>
}
