<div *ngIf="hasProducts" class="w-full overflow-hidden">

  <!-- header -->
  <div class="flex justify-between items-center mb-6">

    <h2 class="NewAldyFontType4 tracking-wider">
      {{ title }}
    </h2>

    <div class="flex gap-2">
      <button (click)="prev()" class="w-9 h-9 border rounded">‹</button>
      <button (click)="next()" class="w-9 h-9 border rounded">›</button>
    </div>

  </div>

  <!-- viewport -->
  <div class="overflow-hidden">

    <!-- track -->
    <div
      class="flex transition-transform duration-300 ease-out"
      [style.transform]="translate"
    >

      <!-- card -->
      <div
        *ngFor="let product of displayProducts"
        class="shrink-0 px-2"
        [style.width.%]="100 / visibleProducts"
      >
        <app-cardproduct
          [product]="product"
          [mobileMode]="'isdesktop'"
          [desktopMode]="'isdesktop'">
        </app-cardproduct>
      </div>

    </div>

  </div>

</div>
