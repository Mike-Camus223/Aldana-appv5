@if (hasProducts) {
<div class="w-full overflow-hidden">
  <div class="flex items-center mb-10 justify-center gap-3 w-full">
    <div class="w-[120px] sm:w-[200px] h-px bg-aldy-green-gray/30 -translate-y-[1px]"></div>
    <p class="NewAldyTitle text-aldy-green-gray text-lg tracking-[0.35em] font-light uppercase leading-none">
      {{ carouselTitle }}
    </p>
    <div class="w-[120px] sm:w-[200px] h-px bg-aldy-green-gray/30 -translate-y-[1px]"></div>
  </div>
  <div class="relative group">
    <button (click)="prev(); $event.stopPropagation()"
      class="hidden md:flex cursor-pointer absolute top-1/2 left-[30px] z-30 w-10 h-10 bg-aldy-white items-center justify-center -translate-y-1/2 -translate-x-[30px] opacity-0 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-300 ease-out">
      <lucide-icon name="chevron-left" [size]="28" [strokeWidth]="1"
        class="text-gray-400 hover:text-aldy-medium transition-colors duration-200"></lucide-icon>
    </button>
    <button (click)="next(); $event.stopPropagation()"
      class="hidden md:flex cursor-pointer absolute top-1/2 right-[30px] z-30 w-10 h-10 bg-aldy-white items-center justify-center -translate-y-1/2 translate-x-[30px] opacity-0 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-300 ease-out">
      <lucide-icon name="chevron-right" [size]="28" [strokeWidth]="1"
        class="text-gray-400 hover:text-aldy-medium transition-colors duration-200"></lucide-icon>
    </button>
    <div class="overflow-hidden">
      <div class="flex transition-transform duration-300 ease-out" [style.transform]="translate">
        @for (product of displayProducts; track product) {
        <div class="shrink-0 px-2" [style.width.%]="100 / visibleProducts">
          <app-cardproduct [product]="product" [mobileMode]="'isdesktop'" [desktopMode]="'isdesktop'">
          </app-cardproduct>
        </div>
        }
      </div>
    </div>
    <div class="md:hidden flex justify-center gap-6 sm:gap-8 mt-6 sm:mt-8">
      <button (click)="prev(); $event.stopPropagation()"
        class="w-8 h-8 flex items-center justify-center hover:scale-110 border-1 border-aldy-medium transition-all duration-250 cursor-pointer ease-in-out">
        <lucide-icon name="chevron-left" color="#AEC2A9" [size]="20" [strokeWidth]="1"></lucide-icon>
      </button>
      <button (click)="next(); $event.stopPropagation()"
        class="w-8 h-8 flex items-center justify-center hover:scale-110 border-1 border-aldy-medium transition-all duration-250 cursor-pointer ease-in-out">
        <lucide-icon name="chevron-right" color="#AEC2A9" [size]="20" [strokeWidth]="1"></lucide-icon>
      </button>
    </div>
  </div>
</div>
}
