<section class="w-full px-4 max-w-screen-2xl mx-auto mt-6 md:mt-0">

  <!-- BAJÉ LA ALTURA A min-h-[750px] -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 items-center min-h-[750px] relative">

    <!-- ========================================================= -->
    <!-- COLUMNA IZQUIERDA — INFORMACIÓN -->
    <!-- ========================================================= -->
    <div class="relative flex flex-col justify-center text-center lg:text-left">

      <!-- SVG decorativo -->
      <div
        class="absolute inset-0 flex justify-center lg:justify-start items-center 
               pointer-events-none select-none z-0"
      >
        <img
          src="assets/svg/logos-03.svg"
          alt="Aldana Vilcabana"
          class="w-[180px] sm:w-[240px] xl:w-[350px] opacity-20 object-contain"
          draggable="false"
        />
      </div>

      <!-- Contenido principal -->
      <div class="relative z-10 w-full flex flex-col items-center lg:items-start">

        <!-- TÍTULO CON ACENTO CONSERVADO -->
        <h2
          appWordReveal
          class="text-3xl sm:text-4xl lg:text-[48px] xl:text-[68px]
                 leading-tight text-white NewAldyTitle font-light"
        >
          Del Juego a la Pasi<span class="NewAldyFontTypeAccent relative -top-[1px]">ó</span>n
        </h2>

        <p
          appFadeUpLetter
          class="text-white NewAldyFontType4 text-base leading-8 mt-6 max-w-xl"
        >
          Desde mis primeros diseños para muñecas, transformando retazos de tela 
          en vestuarios imaginativos, hasta la creación de piezas exclusivas 
          y a medida para mis clientas de hoy, una constante innegable ha marcado mi camino...
        </p>

        <a
          href="/acerca-de-mi"
          class="mt-8 w-1/2 sm:w-1/3 flex justify-center mx-auto lg:mx-0
                 border border-white text-white py-3 px-5 text-xs tracking-widest 
                 font-medium uppercase NewAldyFontType4 transition-colors 
                 hover:bg-aldy-green-gray hover:border-aldy-green-gray hover:text-white"
        >
          VER MÁS
        </a>

      </div>
    </div>

    <!-- ========================================================= -->
    <!-- COLUMNA DERECHA — FOTO MÁS GRANDE -->
    <!-- ========================================================= -->
    <div class="relative w-full flex justify-center items-center">

      <!-- FOTO MÁS GRANDE (ANTES max-w-3xl → AHORA max-w-4xl) -->
      <div class="w-full max-w-4xl">
        <img
          #aboutImage
          [draggable]="false"
          src="assets/images/loadingIMG/loading1.jpg"
          alt="About image"
          class="w-full h-auto object-contain"
        />
      </div>

    </div>

  </div>
</section>
