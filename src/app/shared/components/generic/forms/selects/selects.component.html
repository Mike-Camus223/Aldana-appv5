<div class="relative w-full" [id]="id">

  <!-- Trigger -->
  <div
    (click)="toggleDropdown()"
    (keydown)="onKeyDown($event)"
    [attr.tabindex]="disabled ? -1 : 0"
    role="combobox"
    [attr.aria-expanded]="isOpen"
    class="flex items-center w-full px-3 gap-3 min-h-[52px] cursor-pointer border transition-all duration-200"
    [ngClass]="{
      'bg-aldy-white border-red-400': invalid,
      'bg-aldy-white border-[#7A8C6E]': isOpen && !invalid,
      'bg-aldy-white border-[#7A8C6E]/40': !isOpen && !invalid,
      'opacity-60 cursor-not-allowed': disabled
    }">

    <!-- Texto -->
    <span
      class="flex-1 NewAldyFontType4 tracking-wide text-[13px]"
      [ngClass]="{
        'text-red-400': invalid,
        'text-[#5A5A4A]': !invalid && value,
        'text-[#B0ADA5]': !invalid && !value
      }">
      {{ value ? getDisplayText() : 'Seleccionar opción' }}
    </span>

    <!-- Icono -->
    <svg
      class="w-4 h-4 transition-transform duration-200 shrink-0"
      [class.rotate-180]="isOpen"
      [ngClass]="invalid ? 'text-red-400' : 'text-[#5A5A4A]'"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 9l-7 7-7-7"/>
    </svg>

  </div>

  <!-- Dropdown -->
  <div
    *ngIf="isOpen"
    @slideDown
    class="absolute z-50 w-full mt-1 bg-aldy-white border border-[#e0d8cf] shadow-sm overflow-hidden">

    <div class="max-h-52 overflow-y-auto">

      <div
        *ngFor="let option of options"
        (click)="selectOption(option)"
        class="flex items-center justify-between px-3.5 py-3 NewAldyFontType4 text-[13px] tracking-wide cursor-pointer transition-colors duration-150"
        [ngClass]="{
          'bg-aldy-light text-aldy-medium': isSelected(option),
          'text-[#5A5A4A] hover:bg-aldy-light': !isSelected(option)
        }">

        <span>{{ getOptionLabel(option) }}</span>

        <svg
          *ngIf="isSelected(option)"
          class="w-3.5 h-3.5 text-aldy-medium shrink-0"
          fill="currentColor"
          viewBox="0 0 20 20">
          <path fill-rule="evenodd"
            d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
            clip-rule="evenodd"/>
        </svg>

      </div>

    </div>
  </div>

</div>
