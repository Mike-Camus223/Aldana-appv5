<div class="relative w-full">
  <div class="flex items-center w-full border px-3 gap-3 transition-all duration-200 min-h-[52px]" [ngClass]="{
      'bg-aldy-white border-red-400': invalid,
      'bg-aldy-white border-[#7A8C6E]': !invalid && isFocused,
      'bg-aldy-white border-[#C8C4BA]': !invalid && !isFocused
    }">

    <input [id]="id" [value]="value" (input)="onInput($event)" [disabled]="disabled" (focus)="onFocus()"
      (blur)="onBlur()" type="text" [placeholder]="label" [ngClass]="{
        'text-red-400 placeholder-red-400': invalid,
        'text-[#5A5A4A] placeholder-[#B0ADA5]': !invalid && !disabled,
        'text-[#8A8A7A] placeholder-[#B0ADA5] opacity-60': disabled
      }" class="flex-1 focus:outline-none focus:ring-0 NewAldyFontType4 tracking-wide min-w-0 py-3 text-[13px]" />

  </div>
</div>
