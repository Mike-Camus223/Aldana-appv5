<div class="relative">
  <input
    [id]="id"
    [value]="value"
    (input)="onInput($event)"
    [disabled]="disabled"
    (blur)="onTouched()"
    type="text"
    placeholder=" "
    [ngClass]="{
      'border-red-400 text-red-400 focus:border-red-400': invalid,
      'border-aldy-primary-400 focus:border-aldy-primary-400': !invalid && !disabled,
      'border-gray-300': !invalid && !disabled,
      'bg-gray-100 text-gray-400': disabled,
      'text-gray-900': !invalid && !disabled
    }"
    class="peer block w-full border-b-1 px-2.5 pt-4 pb-2.5 text-sm bg-transparent appearance-none focus:outline-none focus:ring-0 transition-all duration-300 ease-in-out"
  />
  <label
    [for]="id"
    [ngClass]="{
      'text-red-400 peer-focus:text-red-400': invalid,
      'text-gray-400 peer-disabled:text-gray-400': disabled,
      'text-gray-500 peer-focus:text-aldy-primary-400': !invalid && !disabled
    }"
    class="pointer-events-none absolute start-1 top-2 z-10 origin-[0] -translate-y-4 scale-75 transform bg-white px-2 text-sm text-gray-500 transition-all duration-300
           peer-placeholder-shown:top-1/2 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:scale-100 
           peer-focus:top-2 peer-focus:-translate-y-4 peer-focus:scale-75"
  >
    {{ label }}
  </label>
</div>
