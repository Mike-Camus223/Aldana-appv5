<div class="relative w-full">
  <div
    class="flex items-center w-full border px-3 gap-3 transition-all duration-200 min-h-[52px]"
    [ngClass]="{
      'opacity-60': disabled,
      'bg-aldy-white border-red-400': invalid,
      'bg-aldy-white border-[#7A8C6E]': !invalid && isFocused,
      'bg-aldy-white border-[#C8C4BA]': !invalid && !isFocused
    }">
    <lucide-icon
      name="lock"
      [size]="17"
      class="text-[#B0ADA5] flex-shrink-0">
    </lucide-icon>
    <input
      [id]="id"
      [value]="value"
      [disabled]="disabled"
      [type]="showPassword ? 'text' : 'password'"
      (input)="onInput($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      [ngClass]="{
        'text-red-400': invalid,
        'text-[#5A5A4A]': !invalid && !disabled,
        'text-[#8A8A7A]': disabled,
        'tracking-wide': showPassword,
        'tracking-[0.3em]': !showPassword
      }"
      class="flex-1 bg-transparent focus:outline-none focus:ring-0 NewAldyFontType4 min-w-0 py-3 text-[13px]"
    />
    <button
      type="button"
      (click)="toggleVisibility()"
      (blur)="onBlur()"
      tabindex="-1"
      [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
      class="flex-shrink-0 transition focus:outline-none cursor-pointer text-[#B0ADA5]">
      <lucide-icon
        *ngIf="!showPassword"
        name="eye-closed"
        [size]="17"
        color="#889287"
        [strokeWidth]="1.5">
      </lucide-icon>
      <lucide-icon
        *ngIf="showPassword"
        name="eye"
        [size]="17"
        color="#889287"
        [strokeWidth]="1.5">
      </lucide-icon>
    </button>
  </div>
</div>
