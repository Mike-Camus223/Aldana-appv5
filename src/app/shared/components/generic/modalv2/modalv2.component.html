<div
  *ngIf="open"
  class="fixed inset-0 flex items-center justify-center bg-aldy-white bg-opacity-60 backdrop-blur-sm transition-opacity duration-300"
  [ngClass]="{
    'opacity-100': animate,
    'opacity-0': !animate
  }"
>
  <div
    class="relative bg-aldy-white rounded-2xl shadow-xl p-6 max-w-lg w-full transform transition-all duration-300"
    [ngClass]="{
      'scale-100 opacity-100 translate-y-0': animate,
      'scale-95 opacity-0 translate-y-4': !animate
    }"
  >
    <button
      (click)="close()"
      class="absolute top-3 right-3 cursor-pointer items-center justify-center rounded hover:bg-black/5 transition-colors duration-200"
    >
      <i class="fa-solid fa-xmark text-lg"></i>
    </button>
    <ng-content></ng-content>
  </div>
</div>
