<!-- El lightbox SIEMPRE está en el DOM — GSAP controla opacity/visibility -->
<div #lightboxRoot
  style="z-index: 100; opacity: 0; visibility: hidden;"
  class="fixed inset-0 flex max-h-screen w-full flex-col pointer-events-none">

  <!-- BACKGROUND -->
  <div class="absolute inset-0 bg-aldy-white z-0"></div>

  <!-- CLOSE -->
  <button (click)="close()"
    class="absolute top-6 right-6 z-30 flex h-12 w-12 cursor-pointer items-center justify-center border border-aldy-medium text-aldy-medium transition-all duration-200 ease-in-out hover:scale-110">
    <lucide-icon name="x" color="#AEC2A9" [size]="16" [strokeWidth]="1.5"></lucide-icon>
  </button>

  <!-- CONTENT -->
  <div class="relative z-10 flex w-full h-full flex-col">

    <!-- SLIDER -->
    <div class="relative flex-1" (wheel)="onWheel($event)">

      <!-- PREV -->
      <button (click)="prev()"
        class="absolute left-4 top-1/2 z-30 flex h-12 w-12 -translate-y-1/2 cursor-pointer items-center justify-center border border-aldy-medium transition-all duration-200 ease-in-out hover:scale-110 md:left-10">
        <lucide-icon name="chevron-left" color="#AEC2A9" [strokeWidth]="1.5"></lucide-icon>
      </button>

      <!-- NEXT -->
      <button (click)="next()"
        class="absolute right-4 top-1/2 z-30 flex h-12 w-12 -translate-y-1/2 cursor-pointer items-center justify-center border border-aldy-medium transition-all duration-200 ease-in-out hover:scale-110 md:right-10">
        <lucide-icon name="chevron-right" color="#AEC2A9" [strokeWidth]="1.5"></lucide-icon>
      </button>

      <div *ngFor="let item of items; let i = index; trackBy: trackByIndex" #slideRef
        class="absolute inset-0 flex items-center justify-center">

        <!-- IMAGE -->
        <img *ngIf="!isVideo(item)" [src]="item.url"
          (click)="onImgClick()"
          (mousedown)="startDrag($event)"
          (mousemove)="onDrag($event)"
          (dragstart)="$event.preventDefault()"
          [style.transform]="i === activeIndex ? getImgTransform() : 'scale(1)'"
          [style.transition]="isDragging ? 'none' : 'transform 300ms cubic-bezier(0.4,0,0.2,1)'"
          [style.pointerEvents]="i === activeIndex ? 'auto' : 'none'"
          [ngClass]="{
            'cursor-plus':  !zoomed && i === activeIndex,
            'cursor-grabbing': isDragging && i === activeIndex,
            'cursor-minus': zoomed && i === activeIndex
          }"
          class="block h-full w-full select-none object-contain touch-none will-change-transform" />

        <!-- VIDEO -->
        <video *ngIf="isVideo(item)" #videoPlayer
          [src]="item.url"
          [poster]="item.poster"
          autoplay muted loop playsinline
          (click)="toggleVideo(videoPlayer)"
          [style.pointerEvents]="i === activeIndex ? 'auto' : 'none'"
          class="absolute inset-0 h-full w-full cursor-pointer object-contain outline-none">
        </video>

        <!-- VIDEO OVERLAY -->
        <div *ngIf="i === activeIndex && showVideoOverlay"
          class="pointer-events-none absolute inset-0 z-20 flex items-center justify-center [animation:videoOverlayFade_900ms_ease_forwards]">
          <div class="flex h-[90px] w-[90px] items-center justify-center rounded-full bg-black/45 backdrop-blur-[14px]">
            <lucide-icon [name]="videoOverlayIcon" color="#fff" [size]="50" [strokeWidth]="1.5"></lucide-icon>
          </div>
        </div>

      </div>
    </div>

    <!-- THUMBS -->
    <div class="flex w-full h-[100px] flex-shrink-0 items-center justify-center gap-4 px-16 z-10">
      <button *ngFor="let item of items; let i = index" (click)="goTo(i)"
        class="h-12 w-12 flex-shrink-0 cursor-pointer overflow-hidden rounded-full border transition-all duration-150 ease-out md:h-[60px] md:w-[60px]"
        [ngClass]="{
          'scale-110 border-[1px] border-aldy-medium': i === activeIndex,
          'border-transparent': i !== activeIndex
        }">
        <img [src]="getThumb(item)" class="h-full w-full object-cover" loading="lazy" />
      </button>
    </div>

  </div>
</div>
