<ng-container *ngIf="isOpen">
  <div
    class="fixed inset-0 z-[1000] flex items-center justify-center transition-opacity duration-300 ease-out"
    [ngClass]="{
      'opacity-100': !isClosing,
      'opacity-0': isClosing
    }"
  >
    <!-- BACKGROUND -->
    <div class="absolute inset-0 bg-aldy-white"></div>

    <!-- CLOSE -->
    <button
      (click)="close()"
      class="absolute top-6 right-6 z-30 flex h-12 w-12 cursor-pointer items-center justify-center border border-aldy-medium text-aldy-medium transition-all duration-200 ease-in-out hover:scale-110"
    >
      <lucide-icon
        name="x"
        color="#AEC2A9"
        [size]="16"
        [strokeWidth]="1.5"
      ></lucide-icon>
    </button>

    <!-- PREV -->
    <button
      (click)="prev()"
      class="absolute left-4 top-1/2 z-30 flex h-12 w-12 -translate-y-1/2 cursor-pointer items-center justify-center border border-aldy-medium transition-all duration-200 ease-in-out hover:scale-110 md:left-10"
    >
      <lucide-icon
        name="chevron-left"
        color="#AEC2A9"
        [strokeWidth]="1.5"
      ></lucide-icon>
    </button>

    <!-- NEXT -->
    <button
      (click)="next()"
      class="absolute right-4 top-1/2 z-30 flex h-12 w-12 -translate-y-1/2 cursor-pointer items-center justify-center border border-aldy-medium transition-all duration-200 ease-in-out hover:scale-110 md:right-10"
    >
      <lucide-icon
        name="chevron-right"
        color="#AEC2A9"
        [strokeWidth]="1.5"
      ></lucide-icon>
    </button>

    <!-- CONTENT -->
    <div class="relative z-10 flex w-full flex-col items-center px-0 md:px-20">

      <!-- SLIDER -->
      <div
        class="relative flex h-[65vh] w-screen max-w-none items-center justify-center md:h-[84vh] md:max-w-[1300px]"
        (wheel)="onWheel($event)"
      >

        <div
          *ngFor="let item of items; let i = index; trackBy: trackByIndex"
          #slideRef
          class="absolute inset-0 flex items-center justify-center transition-opacity duration-[280ms] ease-[cubic-bezier(0.4,0,0.2,1)]"
          [ngClass]="{
            'opacity-100 pointer-events-auto': i === activeIndex,
            'opacity-0 pointer-events-none': i !== activeIndex
          }"
        >

          <!-- IMAGE -->
          <img
            *ngIf="!isVideo(item)"
            [src]="item.url"
            (click)="onImgClick()"
            (mousedown)="startDrag($event)"
            (mousemove)="onDrag($event)"
            (dragstart)="$event.preventDefault()"
            [style.transform]="
              i === activeIndex ? getImgTransform() : 'scale(1)'
            "
            [style.transition]="
              isDragging
                ? 'none'
                : 'transform 300ms cubic-bezier(0.4,0,0.2,1)'
            "
            [style.pointerEvents]="i === activeIndex ? 'auto' : 'none'"
            [ngClass]="{
              'cursor-plus': !zoomed && i === activeIndex,
              'cursor-grabbing': isDragging && i === activeIndex,
              'cursor-minus': zoomed && i === activeIndex
            }"
            class="
              relative block h-full w-full select-none object-contain
              touch-none will-change-transform
              md:h-auto md:w-auto md:max-h-full md:max-w-full
              2xl:max-h-[84vh] 2xl:max-w-[1300px]
            "
          />

          <!-- VIDEO -->
          <video
            *ngIf="isVideo(item)"
            #videoPlayer
            [src]="item.url"
            [poster]="item.poster"
            autoplay
            muted
            loop
            playsinline
            (click)="toggleVideo(videoPlayer)"
            [style.pointerEvents]="i === activeIndex ? 'auto' : 'none'"
            class="h-full w-full cursor-pointer bg-aldy-white object-contain outline-none"
          ></video>

          <!-- VIDEO OVERLAY -->
          <div
            *ngIf="i === activeIndex && showVideoOverlay"
            class="
              pointer-events-none absolute inset-0 z-20
              flex items-center justify-center
              [animation:videoOverlayFade_900ms_ease_forwards]
            "
          >
            <div
              class="
                flex h-[90px] w-[90px]
                items-center justify-center
                rounded-full bg-black/45
                backdrop-blur-[14px]
              "
            >
              <lucide-icon
                [name]="videoOverlayIcon"
                color="#fff"
                [size]="50"
                [strokeWidth]="1.5"
              ></lucide-icon>
            </div>
          </div>

        </div>
      </div>

      <!-- THUMBS -->
      <div
        class="
          fixed bottom-10 left-1/2 z-20
          flex w-full max-w-screen-sm
          -translate-x-1/2 flex-wrap justify-center gap-5 px-4
          md:static md:left-auto md:bottom-auto
          md:w-auto md:max-w-none md:translate-x-0
          md:gap-4 md:mt-5
        "
      >
        <button
          *ngFor="let item of items; let i = index"
          (click)="goTo(i)"
          class="
            h-12 w-12 flex-shrink-0
            cursor-pointer overflow-hidden rounded-full
            border transition-all duration-150 ease-out
            md:h-[70px] md:w-[70px]
          "
          [ngClass]="{
            'scale-140 border-[1px] border-aldy-medium md:scale-110':
              i === activeIndex,
            'border-transparent': i !== activeIndex
          }"
        >
          <img
            [src]="getThumb(item)"
            class="h-full w-full object-cover"
            loading="lazy"
          />
        </button>
      </div>

    </div>
  </div>
</ng-container>
