<ng-container *ngIf="isOpen">
  <div class="fixed inset-0 z-[1000] flex items-center justify-center"
    [ngClass]="{ 'lb-open': !isClosing, 'lb-close': isClosing }">
    <div class="absolute inset-0 bg-aldy-white"></div>
    <button (click)="close()"
      class="absolute w-12 h-12 hover:scale-110 border-1 flex justify-center items-center text-aldy-medium border-aldy-medium transition-all duration-250 cursor-pointer ease-in-out top-6 right-6 z-30">
      <lucide-icon name="x" color="#AEC2A9" [size]="16" [strokeWidth]="1.5"></lucide-icon>
    </button>
    <button (click)="prev()"
      class="absolute w-12 h-12 hover:scale-110 border-1 flex justify-center items-center border-aldy-medium transition-all duration-250 cursor-pointer ease-in-out left-4 md:left-10 top-1/2 -translate-y-1/2 z-30">
      <lucide-icon name="chevron-left" color="#AEC2A9" [strokeWidth]="1.5"></lucide-icon>
    </button>
    <button (click)="next()"
      class="absolute w-12 h-12 flex items-center justify-center hover:scale-110 border-1 border-aldy-medium transition-all duration-250 cursor-pointer ease-in-out right-4 md:right-10 top-1/2 -translate-y-1/2 z-30">
      <lucide-icon name="chevron-right" color="#AEC2A9" [strokeWidth]="1.5"></lucide-icon>
    </button>
    <div class="flex flex-col items-center relative z-10 w-full">
      <div class="w-[520px] h-[699px] max-w-[95vw] max-h-[75vh] relative flex items-center justify-center"
        (wheel)="onWheel($event)">
        <div *ngFor="let item of items; let i = index; trackBy: trackByIndex" #slideRef
          class="absolute inset-0 flex items-center justify-center">
          <img *ngIf="!isVideo(item)" [src]="item.url" (click)="onImgClick()" (mousedown)="startDrag($event)"
            (mousemove)="onDrag($event)" (dragstart)="$event.preventDefault()"
            [style.transform]="i === activeIndex ? getImgTransform() : 'scale(1)'"
            [style.transition]="isDragging ? 'none' : 'transform 300ms cubic-bezier(0.4,0,0.2,1)'"
            [style.pointerEvents]="i === activeIndex ? 'auto' : 'none'" [ngClass]="{
              'cursor-plus ': !zoomed && i === activeIndex,
  'cursor-grabbing': isDragging && i === activeIndex,
  'cursor-minus': zoomed && i === activeIndex,
              'cursor-zoom-out': zoomed && i === activeIndex
            }" class="lb-img" />
          <video *ngIf="isVideo(item)" [src]="item.url" [poster]="item.poster" controls [autoplay]="i === activeIndex"
            muted playsinline [style.pointerEvents]="i === activeIndex ? 'auto' : 'none'"
            class="lb-img video-el bg-aldy-white">
          </video>

        </div>
      </div>
      <div class="flex gap-4 mt-10 relative z-20 px-4">
        <button *ngFor="let item of items; let i = index" (click)="goTo(i)" class="w-11 h-11 lg:w-21 lg:h-21 flex-shrink-0 rounded-full 
                 transition-all duration-150 ease-out
                 cursor-pointer overflow-hidden border
                 hover:scale-110" [ngClass]="{
            'border-aldy-medium border-[2px] scale-110': i === activeIndex,
            'border-transparent': i !== activeIndex
          }">
          <img [src]="getThumb(item)" class="w-full h-full object-cover" loading="lazy" />
        </button>
      </div>
    </div>
  </div>
</ng-container>
