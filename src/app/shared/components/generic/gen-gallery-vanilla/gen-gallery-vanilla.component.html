<div *ngFor="let row of rows" class="mb-12">

  <h3 class="text-sm tracking-widest text-aldy-green-gray mb-4 uppercase">
    {{ row.label }}
  </h3>

  <div class="grid grid-cols-2 lg:grid-cols-5 gap-4">

    <div *ngFor="let item of row.items; let i = index"
         (click)="openLightbox(row.items, i)"
         class="cursor-pointer overflow-hidden group">

      <div class="aspect-[2/3] w-full overflow-hidden">

        <img *ngIf="item.type === 'image'"
             [src]="item.url"
             loading="lazy"
             decoding="async"
             class="w-full h-full object-cover group-hover:scale-105 transition"/>

        <video *ngIf="item.type === 'video'"
               [src]="item.url"
               [poster]="item.poster"
               muted
               loop
               preload="metadata"
               class="w-full h-full object-cover">
        </video>

      </div>

    </div>

  </div>

</div>

<app-gen-lightbox-vanilla
  *ngIf="lightboxOpen"
  [isOpen]="lightboxOpen"
  [items]="lightboxItems"
  [startIndex]="lightboxIndex"
  (closed)="closeLightbox()">
</app-gen-lightbox-vanilla>
