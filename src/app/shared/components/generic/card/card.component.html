<div class="flex flex-col items-center w-full">
  <div class="group block relative w-full cursor-pointer">
      <!-- Botón de Favoritos -->
      <button 
          (click)="$event.stopPropagation(); toggleFavorite($event)"
          [disabled]="isLoading"
          class="absolute top-2 right-2 z-30 p-2 rounded-full bg-white/80 backdrop-blur-sm hover:bg-white transition-colors duration-200 shadow-sm"
          aria-label="Toggle favorite">
          <svg 
              width="20" 
              height="20" 
              viewBox="0 0 24 24" 
              fill="none" 
              stroke="currentColor" 
              stroke-width="2" 
              stroke-linecap="round" 
              stroke-linejoin="round"
              [class.text-red-500]="isFavorite"
              [class.text-gray-400]="!isFavorite"
              [class.fill-red-500]="isFavorite"
              [class.fill-transparent]="!isFavorite">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
      </button>
      
      <div class="aspect-[3/4] overflow-hidden w-full bg-gray-100 relative">
          <img [src]="product?.main_image || 'assets/images/placeholder-product.jpg'"
              [alt]="product?.name || 'Producto'"
              class="object-cover object-top w-full h-full transition-transform duration-500 group-hover:scale-110" />
          <div
              class="absolute inset-0 bg-black/40 z-20 flex flex-col items-center justify-center text-center px-2 transition-opacity duration-300 group-hover:opacity-0">
              <h3 class="text-white text-sm sm:text-base font-semibold uppercase tracking-wide drop-shadow mb-1">
                  {{ product?.name || 'Nombre del producto' }}
              </h3>
              <p class="text-white text-xs drop-shadow">
                {{ product?.price | currency:'ARS':'symbol':'1.0-0' }}
            </p>
          </div>
      </div>
  </div>
</div>
