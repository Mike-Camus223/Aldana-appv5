<div class="grid grid-cols-2 w-full">

  <div class="relative w-full aspect-[2/2] sm:aspect-[3/3] lg:aspect-[9/9] overflow-hidden group">
    <img
      src="../../../../assets/images/Novias.jpeg"
      alt="section1"
      class="absolute inset-0 w-full h-full object-cover object-[center_20%] transition-all duration-500 ease-in-out lg:grayscale group-hover:grayscale-0 pointer-events-none"
    />
    <div class="absolute inset-0 flex items-center justify-center translate-y-6 text-center">
      <a routerLink="/novias-colecciones" class="inline-block relative group/text">
        <span class="inline-block relative">
          <span appWordReveal class="relative z-10 text-2xl sm:text-2xl md:text-3xl lg:text-4xl xl:text-4xl 2xl:text-6xl text-white transition-colors duration-500 font-light uppercase tracking-widest NewAldyTitle group-hover/text:text-aldy-light">
            NOVIAS
          </span>
          <span class="absolute left-0 bottom-[6px] w-full h-[4px] bg-white group-hover/text:bg-aldy-light rounded scale-x-0 origin-left transition-all duration-500 ease-out group-hover/text:scale-x-100"></span>
        </span>
      </a>
    </div>
  </div>

  <div class="relative w-full aspect-[2/2] sm:aspect-[3/3] lg:aspect-[9/9] overflow-hidden group">
    <img
      src="../../../../assets/images/Chlotes.jpg"
      alt="section2"
      class="absolute inset-0 w-full h-full object-cover object-[center_4%] transition-all duration-500 ease-in-out lg:grayscale group-hover:grayscale-0 pointer-events-none"
    />
    <div class="absolute inset-0 flex items-center justify-center translate-y-6 text-center">
      <a [routerLink]="['/tienda']" [queryParams]="{ categoria: 'camisas' }" class="inline-block relative group/text">
        <span class="inline-block relative">
          <span appWordReveal class="relative z-10 text-2xl sm:text-2xl md:text-3xl lg:text-4xl xl:text-4xl 2xl:text-6xl text-white transition-colors duration-500 font-light uppercase tracking-widest NewAldyTitle group-hover/text:text-aldy-light">
            Prêt-à-porter
          </span>
          <span class="absolute left-0 bottom-[6px] w-full h-[4px] bg-white group-hover/text:bg-aldy-light rounded scale-x-0 origin-left transition-all duration-500 ease-out group-hover/text:scale-x-100"></span>
        </span>
      </a>
    </div>
  </div>

</div>
