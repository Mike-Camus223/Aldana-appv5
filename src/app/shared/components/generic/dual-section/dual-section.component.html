<div class="grid grid-cols-2 w-full">
  <!-- NOVIAS -->
  <div class="relative group w-full aspect-[2/2] sm:aspect-[3/3] lg:aspect-[9/9] overflow-hidden">
    <img
      src="../../../../assets/images/Novias.jpeg"
      alt="section1"
      class="absolute inset-0 w-full h-full object-cover object-[center_20%]
             transition-all duration-500 ease-in-out
             lg:grayscale lg:group-hover:grayscale-0 pointer-events-none"
    />
    <div
      class="absolute inset-0 flex items-center justify-center translate-y-6 text-center">
      <a
        appLinkHoverUnderline
        [underlineHeight]="'2px'"
        underlineColor="#D2E4CC"
        routerLink="/novias-colecciones"
        class="flex items-center justify-center w-full h-full"
      >
        <h1
          appWordReveal
          class="text-2xl sm:text-2xl md:text-3xl lg:text-4xl xl:text-4xl  2xl:text-6xl text-white hover:text-aldy-light NewAldyTitle tracking-widest font-light uppercase"
        >
          NOVIAS
        </h1>
      </a>
    </div>
  </div>

  <!-- PRÊT-À-PORTER -->
  <div class="relative group w-full aspect-[2/2] sm:aspect-[3/3] lg:aspect-[9/9] overflow-hidden">
    <img
      src="../../../../assets/images/Chlotes.jpg"
      alt="section2"
      class="absolute inset-0 w-full h-full object-cover object-[center_4%]
             transition-all duration-500 ease-in-out
             lg:grayscale lg:group-hover:grayscale-0 pointer-events-none"
    />
    <div
      class="absolute inset-0 flex items-center justify-center translate-y-6 text-center">
      <a
        appLinkHoverUnderline
        [underlineHeight]="'2px'"
        underlineColor="#D2E4CC"
        [routerLink]="['/tienda']"
        [queryParams]="{ categoria: 'camisas' }"
        class="flex items-center justify-center w-full h-full"
      >
        <h1
          appWordReveal
          class="text-2xl sm:text-2xl md:text-3xl lg:text-4xl xl:text-4xl  2xl:text-6xl text-white hover:text-aldy-light NewAldyTitle tracking-widest font-light uppercase"
        >
          Prêt-à-porter
        </h1>
      </a>
    </div>
  </div>
</div>
