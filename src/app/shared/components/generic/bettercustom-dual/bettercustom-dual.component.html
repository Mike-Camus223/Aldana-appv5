<div
  class="dual-grid"
  [ngClass]="maxwidthandpadding"
  [ngStyle]="gridStyle"
>

  <!-- ── BLOQUE MEDIA ────────────────────────────────────────── -->
  <div class="dual-media" [ngClass]="mediaOrderClass">

    <img
      *ngIf="mediaType === 'image'"
      appCardInitAnimation="up"
      #parallaxImage
      [src]="imageUrl"
      alt="image"
      [ngClass]="imageStyles"
      class="absolute inset-0 w-full h-full object-cover"
    />

    <div
      *ngIf="mediaType === 'video'"
      class="absolute inset-0 w-full h-full"
    >
      <app-video
        [src]="videoSrc"
        [muted]="videoMuted"
        [autoplay]="videoAutoplay"
        [showControls]="videoShowControls"
        [gradientOverlay]="videoGradientOverlay"
        [objectFit]="videoObjectFit"
        height="h-full"
        width="w-full"
      />
    </div>

  </div>

  <!-- ── BLOQUE TEXTO ─────────────────────────────────────────── -->
  <div class="dual-text" [ngClass]="[textContainerClass, textOrderClass]">
    <div class="dual-text-inner">

      <div class="flex w-full flex-col items-center" [ngClass]="titleAndContentClass">
        <h2
          *ngIf="CommentsTestimonial"
          appWordReveal
          class="text-3xl font-bold text-aldy-green-gray-bold"
        >
          ❛❛
        </h2>

        <h2
          appWordReveal
          [ngClass]="[SeparationTitle, StylesTitle]"
          class="text-3xl NewAldyTitle font-light w-full text-aldy-green-gray-bold"
        >
          {{ title }}
        </h2>

        <div *ngIf="divider" class="border-t border-aldy-medium my-3 w-16 mx-auto"></div>
      </div>

      <h3
        *ngFor="let sub of subtitles"
        class="text-xl font-semibold text-aldy-green-gray-bold"
      >
        {{ sub }}
      </h3>

      <p
        appFadeUpLetter
        [ngClass]="[textcontetclass, StylesText]"
        class="text-sm sm:text-base text-aldy-green-gray-bold leading-relaxed NewAldyFontType4 tracking-wider max-w-2xl mx-auto"
      >
        <ng-container *ngIf="CommentsTestimonial; else plainText">
          "{{ contentTestimonial }}"
        </ng-container>
        <ng-template #plainText>{{ contentTestimonial }}</ng-template>
      </p>

      <p
        *ngIf="content"
        [ngClass]="StylesText"
        class="text-sm sm:text-base text-aldy-green-gray-bold leading-relaxed NewAldyFontType4 tracking-wider max-w-2xl mx-auto"
      >
        {{ content }}
      </p>

      <p
        *ngIf="extraContent"
        [ngClass]="textextracontetclass"
        class="mt-4 text-sm sm:text-base text-aldy-green-gray-bold leading-relaxed NewAldyFontType4 tracking-wider max-w-2xl mx-auto"
      >
        {{ extraContent }}
      </p>

    </div>
  </div>

</div>
