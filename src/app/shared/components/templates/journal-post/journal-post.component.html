<div class="h-[72px] lg:h-[88px]"></div>

<section class="bg-aldy-white py-20">
  <div class="max-w-[1700px] mx-auto px-6">

    <!-- LOADING -->
    <ng-container *ngIf="loading">
      <div class="w-full flex justify-center items-center py-24">
        <div class="spinner"></div>
      </div>
    </ng-container>

    <!-- NOT FOUND -->
    <ng-container *ngIf="!loading && notFound">
      <p class="text-center NewAldyFontType4 text-aldy-green-gray py-16">
        No encontramos esta noticia o ya no está publicada.
      </p>
      <div class="flex justify-center">
        <a
          routerLink="/journal"
          appLinkHoverUnderline
          [dynamicColor]="'text-aldy-green-gray-bold'"
          class="text-sm uppercase tracking-widest NewAldyTitle text-aldy-green-gray-bold"
        >
          Volver al diario
        </a>
      </div>
    </ng-container>

    <article *ngIf="!loading && post as p">

      <!-- BREADCRUMB -->
      <nav class="mb-12 text-center">
        <a
          routerLink="/journal"
          appLinkHoverUnderline
          [dynamicColor]="'text-aldy-green-gray-bold'"
          class="text-xs uppercase tracking-widest NewAldyFontType4 text-aldy-green-gray"
        >
          Diario
        </a>
        <span class="text-aldy-green-gray text-xs mx-2">/</span>
        <span class="text-xs uppercase tracking-widest NewAldyFontType4 text-aldy-green-gray-bold">
          {{ p.category?.name }}
        </span>
      </nav>

      <!-- HEADER -->
      <div class="text-center max-w-[900px] mx-auto">
        <p appWordReveal class="text-xs NewAldyFontType4 text-aldy-green-gray">
          {{ formatDate(p) }}
        </p>

        <h1 appWordReveal  class="mt-6 text-3xl md:text-5xl NewAldyTitle text-aldy-green-gray-bold leading-tight">
          {{ p.title }}
        </h1>

        <p 
          *ngIf="p.excerpt"
          class="mt-6 text-base md:text-lg NewAldyFontType4 text-aldy-green-gray leading-relaxed"
        >
          {{ p.excerpt }}
        </p>
      </div>

      <!-- HERO -->
      <div *ngIf="p.cover_image" class="mt-16">
        <img
        appCardInitAnimation="up"
          [src]="p.cover_image"
          [alt]="p.title"
          class="w-full h-[60vh] object-cover"
        />
      </div>

      <!-- BLOQUES -->
      <div class="mt-20 space-y-28">

        <ng-container *ngFor="let block of p.blocks">

          <!-- LINK -->
          <a
            *ngIf="isLinkBlock(block)"
            [href]="block.url"
            target="_blank"
            rel="noopener noreferrer"
            appLinkHoverUnderline
            [dynamicColor]="'text-aldy-green-gray-bold'"
            class="block text-center text-aldy-green-gray-bold NewAldyTitle uppercase tracking-wider text-sm"
          >
            {{ block.content }}
          </a>

          <!-- IMAGEN + TEXTO (FIX FINAL) -->
          <div
            *ngIf="isImageBlock(block)"
            class="flex flex-col md:flex-row items-center gap-16"
            [ngClass]="{
              'md:flex-row-reverse': getImageIndex(block) % 2 === 0
            }"
          >

            <!-- IMAGEN -->
            <div class="w-full md:w-1/2 flex-shrink-0">
              <img
              appCardInitAnimation="up"
                [src]="block.url"
                [alt]="p.title"
                class="w-full h-[520px] object-cover"
              />
            </div>

            <!-- TEXTO -->
            <div
              class="w-full md:w-1/2"
              [ngClass]="{
                'md:pl-12 md:pr-0': getImageIndex(block) % 2 !== 0,
                'md:pr-12 md:pl-0': getImageIndex(block) % 2 === 0
              }"
            >
              <p
                *ngIf="block.content"
                class="max-w-[520px] NewAldyFontType4 text-aldy-green-gray leading-relaxed whitespace-pre-wrap"
                [ngClass]="{
                  'mr-auto text-left': getImageIndex(block) % 2 !== 0,
                  'ml-auto text-left': getImageIndex(block) % 2 === 0
                }"
              >
                {{ block.content }}
              </p>
            </div>

          </div>

          <!-- TEXTO SOLO -->
          <div
            *ngIf="!isLinkBlock(block) && !isImageBlock(block) && block.content"
            class="max-w-[800px] mx-auto text-center"
          >
            <p class="text-base NewAldyFontType4 text-aldy-green-gray leading-relaxed whitespace-pre-wrap">
              {{ block.content }}
            </p>
          </div>

        </ng-container>

      </div>

      <!-- AUTOR -->
      <div *ngIf="p.author" class="mt-24 flex justify-center items-center gap-4">
        <img
        appCardInitAnimation="up"
          *ngIf="p.author.avatar_url"
          [src]="p.author.avatar_url"
          class="w-12 h-12 rounded-full object-cover"
        />
        <p class="NewAldyTitle text-aldy-green-gray-bold text-sm">
          {{ p.author.name }}
        </p>
      </div>

      <!-- VOLVER -->
      <div class="mt-16 text-center">
        <a
          routerLink="/journal"
          appLinkHoverUnderline
          [dynamicColor]="'text-aldy-green-gray-bold'"
          class="tracking-wide text-sm NewAldyTitle uppercase text-aldy-green-gray-bold"
        >
          Ver más notas
        </a>
      </div>

    </article>
  </div>
</section>
