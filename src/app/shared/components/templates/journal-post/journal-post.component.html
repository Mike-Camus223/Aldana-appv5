<div class="h-[72px] lg:h-[88px]"></div>

<section class="bg-aldy-white py-20">
  <div class="max-w-[1700px] mx-auto px-6">
    <ng-container *ngIf="loading">
      <div class="w-full flex justify-center items-center py-24">
        <div class="spinner"></div>
      </div>
    </ng-container>
    <ng-container *ngIf="!loading && notFound">
      <p class="text-center NewAldyFontType4 text-aldy-green-gray py-16">
        No encontramos esta noticia o ya no está publicada.
      </p>

      <div class="flex justify-center">
        <a routerLink="/journal" appLinkHoverUnderline [dynamicColor]="'text-aldy-green-gray-bold'"
          class="text-sm uppercase tracking-widest NewAldyTitle text-aldy-green-gray-bold">
          Volver al diario
        </a>
      </div>
    </ng-container>
    <article *ngIf="!loading && post as p">
      <div class="text-center max-w-[950px] mx-auto mb-24">
        <p appWordReveal class="text-xs NewAldyFontType4 text-aldy-green-gray">
          {{ formatDate(p) }}
        </p>
        <h1 appWordReveal class="mt-6 text-4xl md:text-6xl NewAldyTitle text-aldy-green-gray-bold leading-tight">
          {{ p.title }}
        </h1>
        <p *ngIf="p.excerpt" class="mt-8 text-lg md:text-xl NewAldyFontType4 text-aldy-green-gray leading-relaxed">
          {{ p.excerpt }}
        </p>
      </div>
      <div *ngIf="p.cover_image" class="mb-28">
        <div class="overflow-hidden w-full">
          <img appCardInitAnimation="up" [src]="p.cover_image" [alt]="p.title" class="w-full h-[78vh] object-contain" />
        </div>
      </div>
      <div class="space-y-32">
        <ng-container *ngFor="let section of sections">
          <div *ngIf="section.layout === 'split-left'" class="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
            <div *ngIf="getImage(section)" class="w-full overflow-hidden">
              <img appCardInitAnimation="up" [src]="getImage(section)?.url" class="w-full h-[720px] object-cover" />
            </div>
            <div class="max-w-[520px] mx-auto">
              <p *ngIf="getText(section)"
                class="NewAldyFontType4 text-aldy-green-gray leading-relaxed whitespace-pre-wrap text-base md:text-lg">
                {{ getText(section)?.content }}
              </p>
            </div>
          </div>
          <div *ngIf="section.layout === 'split-right'" class="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
            <div class="max-w-[520px] mx-auto order-2 lg:order-1">
              <p *ngIf="getText(section)"
                class="NewAldyFontType4 text-aldy-green-gray leading-relaxed whitespace-pre-wrap text-base md:text-lg">
                {{ getText(section)?.content }}
              </p>
            </div>
            <div *ngIf="getImage(section)" class="order-1 lg:order-2 w-full overflow-hidden">
              <img appCardInitAnimation="up" [src]="getImage(section)?.url" class="w-full h-[720px] object-cover" />
            </div>
          </div>
          <div *ngIf="section.layout === 'centered'" class="max-w-[900px] mx-auto text-center">
            <p *ngIf="getText(section)"
              class="NewAldyFontType4 text-aldy-green-gray leading-relaxed whitespace-pre-wrap text-lg md:text-xl">
              {{ getText(section)?.content }}
            </p>
          </div>
          <!-- <div *ngIf="section.layout === 'cta'" class="text-center max-w-[900px] mx-auto">
            <p *ngIf="getText(section)"
              class="mb-10 NewAldyFontType4 text-aldy-green-gray text-lg leading-relaxed whitespace-pre-wrap">
              {{ getText(section)?.content }}
            </p>
            <a *ngIf="getButton(section)" [routerLink]="getButton(section)?.button_slug || '/journal'"
              appLinkHoverUnderline [dynamicColor]="'text-aldy-green-gray-bold'"
              class="inline-block uppercase tracking-[0.3em] text-sm NewAldyTitle text-aldy-green-gray-bold">
              {{ getButton(section)?.button_label || 'Ver más' }}
            </a>
          </div> -->
          <!-- <div *ngIf="section.layout === 'full' && getImage(section)" class="w-full overflow-hidden">
            <img appCardInitAnimation="up" [src]="getImage(section)?.url" class="w-full h-[80vh] object-cover" />
          </div> -->
        </ng-container>
      </div>
      <!-- <div *ngIf="p.author" class="mt-32 flex justify-center items-center gap-4">
        <img *ngIf="p.author.avatar_url" [src]="p.author.avatar_url" class="w-14 h-14 rounded-full object-cover" />
        <p class="NewAldyTitle text-aldy-green-gray-bold text-sm uppercase tracking-wider">
          {{ p.author.name }}
        </p>
      </div> -->

        <a
          routerLink="/journal"
          appLinkHoverUnderline
          [dynamicColor]="'text-aldy-green-gray-bold'"
          class="tracking-[0.3em] text-sm NewAldyTitle uppercase text-aldy-green-gray-bold"
        >
          Ver más notas
        </a>
      </div> -->
    </article>
  </div>
</section>
