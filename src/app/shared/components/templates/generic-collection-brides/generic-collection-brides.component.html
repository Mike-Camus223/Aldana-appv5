<div class="h-[0px] lg:h-[88px]"></div>
<section>
    <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>
</section>
<div class="max-w-screen-3xl px-4 sm:px-6 lg:px-12 xl:px-16 2xl:px-24 mx-auto">
  <app-bettercustom-dual 
    *ngIf="collectionBanner"
    [mediaType]="'video'" 
    [title]="collectionTitle"
    [contentTestimonial]="collectionDescription" 
    [videoSrc]="collectionBanner"
    [videoAutoplay]="true" 
    [videoMuted]="true" 
    [useAspectRatio]="false"
    [videoShowControls]="true" 
    [videoGradientOverlay]="false"
    [videoObjectFit]="'object-cover'" 
    [imageWidth]="'64%'" 
    [textWidth]="'36%'" 
    [mobileOrder]="'image-first'"
    [desktopOrder]="'text-first'" 
    [height]="'h-auto md:h-[450px]'" 
    [mobileHeight]="'auto'" 
    [maxwidthandpadding]="'py-0'"
    [textextracontetclass]="'text-center'"
    [textcontetclass]="'text-center md:text-center'"
    [titleAndContentClass]="'text-center uppercase'"
  ></app-bettercustom-dual>
</div>
<div class="px-4 sm:px-6 lg:px-12 xl:px-16 2xl:px-24 w-full">
  <div class="max-w-screen-3xl mx-auto">
    <div class="py-10 md:py-16">
      <div class="mb-8 w-full h-auto flex items-end justify-between flex-wrap gap-4">
        <div class="flex gap-2 items-end">
          <h1 class="flex gap-2 items-end NewAldyTitle text-xl sm:text-3xl text-aldy-green-gray-bold md:text-3xl font-light tracking-tight">
            NOVIAS -
            <span class="font-light text-aldy-green-gray-bold uppercase">{{ collectionTitle }}</span>
          </h1>
          <p class="text-sm mb-1 sm:mb-0 sm:text-lg font-light NewAldyTitle relative -top-[5px] text-aldy-green-gray uppercase mt-2 tracking-wider">
            {{ collectionSubtitle }}
          </p>
        </div>
      </div>

      <!-- PRODUCTOS (click -> items-collection) -->
      <section *ngIf="products?.length" class="mb-12">
        <h2 class="text-md sm:text-xl font-light text-aldy-green-gray-bold NewAldyTitle mb-4 tracking-wider">
          VESTIDOS
        </h2>

        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
          <a
            *ngFor="let p of products"
            class="group block w-full"
            [routerLink]="['/novias-colecciones', collectionSlug, p.slug]"
          >
            <div class="aspect-[4/5] overflow-hidden bg-black/5">
              <img
                [src]="p.main_image"
                [alt]="p.name || 'Producto'"
                class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
                loading="lazy"
              />
            </div>
            <div class="pt-3">
              <div class="text-xs sm:text-sm tracking-widest uppercase NewAldyTitle text-aldy-green-gray-bold">
                {{ p.name }}
              </div>
              <div *ngIf="p.description" class="text-[11px] sm:text-xs NewAldyFontType4 text-aldy-green-gray mt-1 line-clamp-2">
                {{ p.description }}
              </div>
            </div>
          </a>
        </div>
      </section>

      <div class="mb-10" *ngFor="let section of sections">
        <h2 class="text-md sm:text-xl font-light text-aldy-green-gray-bold NewAldyTitle mb-4 tracking-wider">
          {{ section.title }}
        </h2>
        <app-gallery-gen-com [media]="section.media" (mediaClicked)="onMediaClick($event)"></app-gallery-gen-com>
      </div>
    </div>
  </div>
</div>
