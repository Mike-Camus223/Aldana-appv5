<!-- Spacer navbar -->
<div class="h-[72px] lg:h-[88px]"></div>

<!-- Breadcrumb -->
<section>
  <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>
</section>

<!-- ══ Banner de colección ══════════════════════════════════════ -->
<!--
  BETTERCUSTOM DUAL – Banner colección
  Desktop: 2 cols [texto+mannequin overlay | media]
  Mobile/Tablet: media arriba, texto abajo
-->
<div *ngIf="collectionBanner"
  class="relative flex flex-col lg:grid lg:grid-cols-2 w-full min-h-[440px] bg-aldy-white overflow-hidden">

  <!-- ══ COL IZQUIERDA: imagen maniquí + texto encima ════════════ -->
  <div
    class="order-2 lg:order-1 relative flex items-center justify-center min-h-[420px] lg:min-h-[440px] bg-aldy-white overflow-hidden">

    <!-- Imagen maniquí de fondo -->
    <img src="../../../../../assets/images/sections/collection/mannequin_portrait.png" alt=""
      class="absolute left-0 top-1/2 -translate-y-1/2 h-[110%] w-auto object-contain object-left pointer-events-none select-none" />

    <!-- Gradiente hacia la derecha (hacia el borde con la col de media) -->
    
    <!-- Gradiente suave arriba y abajo para suavizar -->
    <div class="absolute inset-x-0 top-0 h-16 bg-gradient-to-b from-aldy-white/60 to-transparent pointer-events-none">
    </div>
    <div
      class="absolute inset-x-0 bottom-0 h-16 bg-gradient-to-t from-aldy-white/60 to-transparent pointer-events-none">
    </div>

    <!-- Contenido de texto centrado sobre el maniquí -->
    <div class="relative z-10 flex h-full justify-center flex-col items-center text-center px-8 py-10 w-full max-w-lg mr-10 ml-auto">
      <div class="absolute inset-y-0 left-0 w-1/2 bg-gradient-to-r from-transparent to-aldy-white pointer-events-none">
    </div>
      <!-- Título -->
      <h1 appWordReveal
        class="NewAldyTitle text-3xl lg:text-[2.6rem] font-light tracking-[0.13em] text-aldy-green-gray-bold uppercase leading-tight m-0">
        {{ collectionTitle }}
      </h1>

      <!-- Descripción -->
      <p appFadeUpLetter
        class="NewAldyFontType4 text-[14px] text-aldy-green-gray-bold leading-[1.8] tracking-wider text-center max-w-lg m-0">
        {{ collectionDescription }}
      </p>

      <!-- Logo AV con líneas decorativas -->
      <div class="flex items-center justify-center gap-4 w-full absolute bottom-10">
        <span class="w-[20%] h-px bg-aldy-medium opacity-60"></span>
        <img src="../../../../../assets/svg/logos-03.svg" alt="AV" class="w-10 h-auto opacity-70" />
        <span class="w-[20%] h-px bg-aldy-medium opacity-60"></span>
      </div>

    </div>
  </div>

  <div class="order-1 lg:order-2 relative overflow-hidden min-h-[260px] lg:min-h-[440px]">

    <div class="absolute inset-0 left-0 w-1/2
         bg-gradient-to-r
         from-aldy-white
         via-aldy-white
         via-[2%]
         to-transparent
         z-10 pointer-events-none">
    </div>
    <div class="absolute inset-0 w-full h-full">
      <app-video [src]="collectionBanner" [muted]="true" [autoplay]="true" [showControls]="true"
        [gradientOverlay]="false" [objectFit]="'object-cover'" height="h-full" width="w-full" />
    </div>

  </div>

</div>

<!-- ══ Cuerpo ═══════════════════════════════════════════════════ -->
<div class="bg-aldy-white w-full px-4 sm:px-6 lg:px-12 xl:px-16 2xl:px-24">
  <div class="max-w-screen-2xl mx-auto py-10 md:py-16">

    <!-- Cabecera: título izq · línea · count der -->
    <div class="flex items-end justify-between gap-4 mb-3 flex-wrap sm:flex-nowrap">

      <!-- Izquierda: título -->
      <div class="flex items-baseline gap-2 flex-wrap">
        <h1
          class="NewAldyTitle text-xl sm:text-2xl md:text-[1.6rem] font-light tracking-[0.1em] text-aldy-green-gray-bold uppercase m-0 leading-tight">
          NOVIAS
        </h1>
        <span class="NewAldyTitle text-xl sm:text-2xl md:text-[1.6rem] font-light text-aldy-green-gray">–</span>
        <span
          class="NewAldyTitle text-xl sm:text-2xl md:text-[1.6rem] font-light tracking-[0.1em] text-aldy-green-gray-bold uppercase leading-tight">
          {{ collectionTitle }}
        </span>
        <span
          class="NewAldyTitle text-[0.7rem] sm:text-xs font-light tracking-[0.18em] text-aldy-green-gray uppercase leading-tight self-end mb-[3px]">
          {{ collectionSubtitle }}
        </span>
      </div>

      <!-- Derecha: cantidad de diseños -->
      <span
        class="NewAldyTitle text-[0.7rem] sm:text-xs font-light tracking-[0.22em] text-aldy-green-gray uppercase whitespace-nowrap self-end mb-[3px]">
        {{ items.length }}&nbsp;DISEÑOS
      </span>

    </div>

    <!-- Línea divisoria -->
    <div class="w-full h-px bg-aldy-medium opacity-40 mb-8 md:mb-10"></div>

    <!-- ══ Grid de productos ═══════════════════════════════════ -->
    <section *ngIf="items.length; else emptyState" class="mb-16">

      <div class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-x-4 gap-y-8 sm:gap-x-5 lg:gap-x-6">

        <a *ngFor="let it of items; trackBy: trackById" class="group block w-full cursor-pointer"
          [routerLink]="['/novias-colecciones', collectionSlug, it.slug]">
          <!-- Imagen portrait -->
          <div class="aspect-[3/5] overflow-hidden bg-[#f0ece8]">
            <img *ngIf="it.thumbUrl" [src]="it.thumbUrl" [alt]="it.title || 'Diseño'"
              class="w-full h-full object-cover object-top transition-transform duration-500 ease-out group-hover:scale-[1.03]"
              appCardInitAnimation="up" loading="lazy" />
          </div>

          <!-- Pie: nombre + botón + -->
          <div class="flex items-center justify-between pt-3 pb-1 gap-2">
            <span
              class="NewAldyTitle text-[0.65rem] sm:text-[0.72rem] font-light tracking-[0.2em] text-aldy-green-gray-bold uppercase leading-tight">
              {{ it.title }}
            </span>
            <button
              class="shrink-0 w-[26px] h-[26px] rounded-full bg-aldy-green-gray-bold text-aldy-white text-base leading-none flex items-center justify-center transition-all duration-200 hover:opacity-80 hover:scale-105"
              [attr.aria-label]="'Ver ' + it.title">
              +
            </button>
          </div>

        </a>

      </div>

    </section>

    <!-- Estado vacío -->
    <ng-template #emptyState>
      <div class="py-10 text-sm NewAldyFontType4 text-aldy-green-gray tracking-wide">
        No hay diseños cargados para esta colección.
      </div>
    </ng-template>

  </div>
</div>
