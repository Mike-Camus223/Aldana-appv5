<div class="h-[0px] lg:h-[88px]"></div>
<section>
    <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>
</section>
<app-bettercustom-dual 
  *ngIf="collectionBanner"
  [mediaType]="'video'" 
  [title]="collectionTitle"
  [contentTestimonial]="collectionDescription" 
  [videoSrc]="collectionBanner"
  [videoAutoplay]="true" 
  [videoMuted]="true" 
  [videoShowControls]="true" 
  [videoGradientOverlay]="false"
  [videoObjectFit]="'object-cover'" 
  [imageWidth]="'64%'" 
  [textWidth]="'36%'" 
  [mobileOrder]="'image-first'"
  [desktopOrder]="'text-first'" 
  [height]="'h-auto md:h-[450px]'" 
  [mobileHeight]="'auto'" 
  [maxwidthandpadding]="'py-0'"
  [textextracontetclass]="'text-center'"
  [textcontetclass]="'text-center md:text-center'"
  [titleAndContentClass]="'text-center uppercase'"
></app-bettercustom-dual>
<div class="px-4 sm:px-6 lg:px-12 xl:px-16 2xl:px-24 w-full">
  <div class="max-w-screen-3xl mx-auto">
    <div class="py-10 md:py-16">
      <div class="mb-8 w-full h-auto flex items-end justify-between flex-wrap gap-4">
        <div class="flex gap-2 items-end">
          <h1 class="flex gap-2 items-end text-xl sm:text-3xl titles md:text-3xl font-bold tracking-tight">
            COLECCIONES
            <span class="text-lg sm:text-lg titles md:text-xl font-bold">-</span>
            <span class="font-light text-gray-600 uppercase">{{ collectionTitle }}</span>
          </h1>
          <p class="text-sm mb-1 sm:mb-0 sm:text-lg font-main text-gray-500 uppercase mt-2 tracking-widest">
            {{ collectionSubtitle }}
          </p>
        </div>
      </div>

      <!-- ITEMS (cards -> items-collection) -->
      <section *ngIf="items?.length; else emptyState" class="mb-12">
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
          <a
            *ngFor="let it of items; trackBy: trackById"
            class="group block w-full"
            [routerLink]="['/colecciones', collectionSlug, it.slug]"
          >
            <div class="aspect-[4/5] overflow-hidden bg-black/5">
              <img
                *ngIf="it.thumbUrl"
                [src]="it.thumbUrl"
                [alt]="it.title || 'Item'"
                class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
                loading="lazy"
              />
            </div>
            <div class="pt-3">
              <div class="text-xs sm:text-sm tracking-widest uppercase titles text-gray-800">
                {{ it.title }}
              </div>
              <div *ngIf="it.subtitle" class="text-[11px] sm:text-xs font-main text-gray-500 mt-1 uppercase tracking-widest line-clamp-1">
                {{ it.subtitle }}
              </div>
              <div *ngIf="it.description" class="text-[11px] sm:text-xs font-main text-gray-500 mt-1 line-clamp-2">
                {{ it.description }}
              </div>
            </div>
          </a>
        </div>
      </section>

      <ng-template #emptyState>
        <div class="py-10 text-sm font-main text-gray-500">
          No hay items cargados para esta colección.
        </div>
      </ng-template>
    </div>
  </div>
</div>
