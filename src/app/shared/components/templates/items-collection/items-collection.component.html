<div class="h-[0px] lg:h-[88px]"></div>

<section>
  <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>
</section>

<!-- HERO -->
<section #heroSection class="w-full bg-aldy-white">
  <div class="max-w-[1800px] mx-auto grid grid-cols-1 lg:grid-cols-2">

    <!-- TEXTO (PINNED) -->
    <div #stickyText class="flex flex-col justify-center px-8 lg:px-16 py-16 space-y-6 lg:h-screen">
      
      <p class="text-[12px] tracking-[0.4em] uppercase text-aldy-green-gray NewAldyFontType4">
        {{ sectionLabel }}
      </p>

      <h1 class="text-6xl lg:text-8xl leading-[1.05] font-light text-aldy-green-gray-bold NewAldyTitle max-w-xl">
        {{ product?.name }}
      </h1>

      <p class="text-md text-aldy-green-gray max-w-xl leading-relaxed NewAldyFontType4">
        {{ product?.description }}
      </p>

      <div class="pt-4 flex flex-wrap gap-4">
        <a
          [routerLink]="backRoute"
          class="px-6 py-4 border border-aldy-green-gray text-aldy-green-gray  text-sm NewAldyFontType4 tracking-widest uppercase hover:bg-aldy-green-gray hover:text-white transition-all duration-300"
        >
          VOLVER
        </a>
        <a
          *ngIf="product"
          [routerLink]="['/producto', product.slug]"
          class="px-6 py-4 border border-aldy-green-gray bg-aldy-green-gray text-white text-sm NewAldyFontType4 tracking-widest uppercase hover:bg-aldy-white hover:text-aldy-green-gray transition-all duration-300"
        >
          VER PRODUCTO
        </a>
      </div>
    </div>

    <!-- IMÁGENES -->
    <div #imagesContainer class="relative">
      <div class="flex flex-col">

        <div
          *ngFor="let img of heroImages"
          class="w-full h-[90vh] lg:h-screen hero-image-reveal"
        >
          <img
            [src]="img"
            class="w-full h-full object-cover"
          />
        </div>

      </div>
    </div>

  </div>
</section>

<!-- GALERÍA -->
<section class="px-6 lg:px-16 w-full pb-20 bg-aldy-white">
  <div class="max-w-[1800px] mx-auto">

    <app-gen-gallery-vanilla
      [rows]="galleryRows">
    </app-gen-gallery-vanilla>

  </div>
</section>

<!-- CAROUSEL DE PRODUCTOS RELACIONADOS -->
<section *ngIf="relatedProducts.length > 0" class="px-6 lg:px-16 w-full pb-20 bg-aldy-white overflow-hidden">
  <div class="max-w-[1800px] mx-auto">
    <div class="flex flex-col lg:flex-row justify-between lg:items-end mb-12 gap-6">
      <h2 class="text-4xl lg:text-5xl font-light text-aldy-green-gray-bold NewAldyTitle">
        MIRA MÁS DE ESTA COLECCIÓN
      </h2>
    </div>

    <div class="relative group/carousel">
      <div class="overflow-hidden">
        <div 
          class="flex transition-transform duration-500 ease-out gap-6"
          [style.transform]="translate"
        >
          <div 
            *ngFor="let item of relatedProducts" 
            [style.flex]="'0 0 calc(' + (100 / visibleProducts) + '% - ' + (24 * (visibleProducts - 1) / visibleProducts) + 'px)'"
            class="group"
          >
            <a [routerLink]="isBrides ? ['/novias-colecciones', collectionSlug, item.slug] : ['/colecciones', collectionSlug, item.slug]" class="block">
              <div class="aspect-[3/5] overflow-hidden mb-4 bg-gray-100">
                <img 
                  [src]="item.main_image" 
                  [alt]="item.name"
                  class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
                />
              </div>
              <h3 class="text-xl text-aldy-green-gray-bold NewAldyTitle mb-1 uppercase">{{ item.name }}</h3>
              <p class="text-xs text-aldy-green-gray NewAldyFontType4 uppercase tracking-[0.2em]">VER DETALLE</p>
            </a>
          </div>
        </div>
      </div>
      
      <!-- Controles Desktop (Sides) -->
      <button 
        (click)="prev()" 
        class="hidden lg:flex absolute left-[-2rem] top-1/2 -translate-y-1/2 w-12 h-12 border border-aldy-green-gray items-center justify-center text-aldy-green-gray hover:bg-aldy-green-gray hover:text-white transition-all z-10 bg-white"
        [class.opacity-0]="carouselIndex === 0"
        [class.pointer-events-none]="carouselIndex === 0"
      >
        <lucide-icon name="chevron-left"></lucide-icon>
      </button>
      <button 
        (click)="next()" 
        class="hidden lg:flex absolute right-[-2rem] top-1/2 -translate-y-1/2 w-12 h-12 border border-aldy-green-gray items-center justify-center text-aldy-green-gray hover:bg-aldy-green-gray hover:text-white transition-all z-10 bg-white"
        [class.opacity-0]="carouselIndex === maxIndex"
        [class.pointer-events-none]="carouselIndex === maxIndex"
      >
        <lucide-icon name="chevron-right"></lucide-icon>
      </button>

      <!-- Controles Mobile -->
      <div class="lg:hidden flex justify-center gap-8 mt-8">
        <button (click)="prev()" class="w-10 h-10 border border-aldy-green-gray flex items-center justify-center text-aldy-green-gray">
          <lucide-icon name="chevron-left"></lucide-icon>
        </button>
        <button (click)="next()" class="w-10 h-10 border border-aldy-green-gray flex items-center justify-center text-aldy-green-gray">
          <lucide-icon name="chevron-right"></lucide-icon>
        </button>
      </div>
    </div>
  </div>
</section>
