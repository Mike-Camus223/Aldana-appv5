<div class="h-[0px] lg:h-[88px]"></div>

<section>
  <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>
</section>

<!-- HERO -->
<section #heroSection class="w-full bg-aldy-white">
  <div class="max-w-[1800px] mx-auto grid grid-cols-1 lg:grid-cols-2">

    <!-- TEXTO (PINNED) -->
    <div #stickyText class="flex flex-col justify-center px-8 lg:px-16 py-16 space-y-6 lg:h-screen">
      
      <p class="text-[12px] tracking-[0.4em] uppercase text-aldy-green-gray NewAldyFontType4">
        {{ sectionLabel }}
      </p>

      <h1 class="text-6xl lg:text-8xl leading-[1.05] font-light text-aldy-green-gray-bold NewAldyTitle max-w-xl">
        {{ product?.name }}
      </h1>

      <p class="text-md text-aldy-green-gray max-w-xl leading-relaxed NewAldyFontType4">
        {{ product?.description }}
      </p>

      <div class="pt-4 flex flex-wrap gap-4">
        <a
          [routerLink]="backRoute"
          class="px-6 py-4 border border-aldy-green-gray text-aldy-green-gray  text-sm NewAldyFontType4 tracking-widest uppercase hover:bg-aldy-green-gray hover:text-white transition-all duration-300"
        >
          VOLVER
        </a>
        <a
          *ngIf="product"
          [routerLink]="['/shop', product.slug]"
          class="px-6 py-4 border border-aldy-green-gray bg-aldy-green-gray text-white text-sm NewAldyFontType4 tracking-widest uppercase hover:bg-aldy-white hover:text-aldy-green-gray transition-all duration-300"
        >
          VER PRODUCTO
        </a>
      </div>
    </div>

    <!-- IMÁGENES -->
    <div #imagesContainer class="relative">
      <div class="flex flex-col">

        <div
          *ngFor="let img of heroImages"
          class="w-full h-[90vh] lg:h-screen hero-image-reveal"
        >
          <img
            [src]="img"
            class="w-full h-full object-cover"
          />
        </div>

      </div>
    </div>

  </div>
</section>

<!-- GALERÍA -->
<section class="px-6 lg:px-16 w-full pb-20 bg-aldy-white">
  <div class="max-w-[1800px] mx-auto">

    <app-gen-gallery-vanilla
      [rows]="galleryRows">
    </app-gen-gallery-vanilla>

  </div>
</section>
