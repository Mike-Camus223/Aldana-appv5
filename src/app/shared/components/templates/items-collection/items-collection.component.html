<div class="h-[0px] lg:h-[88px]"></div>

<section>
  <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>
</section>

<!-- ============================================================
     HERO EDITORIAL
     Estructura:
     - Un wrapper exterior (#hero-scroll-track) con altura = heroImages.length × 100vh
       para que haya "recorrido" de scroll.
     - Dentro: grid de 2 columnas.
       · Izquierda (.hero-sticky-left): sticky, centrado verticalmente.
       · Derecha (.hero-sticky-right): sticky overflow:hidden, con una
         "tira" (.hero-image-strip) que GSAP desplaza hacia arriba.
     ============================================================ -->
<section
  id="hero-scroll-track"
  class="w-full bg-aldy-white"
  [style.height.px]="heroImages.length > 1 ? (heroImages.length * 100) + 'vh' : '100vh'"
>
  <div class="max-w-[1800px] mx-auto grid grid-cols-1 lg:grid-cols-2 lg:h-full">

    <!-- TEXTO (sticky izquierda) -->
    <div class="hero-sticky-left px-8 lg:px-16 py-16 space-y-6">
      <p class="text-[10px] tracking-[0.4em] uppercase text-aldy-green-gray NewAldyFontType4">
        {{ sectionLabel }}
      </p>

      <h1 class="text-6xl lg:text-8xl leading-[1.05] font-light text-aldy-green-gray-bold NewAldyTitle max-w-xl">
        {{ isItemDetailLayout ? (collectionItem?.title) : (product?.name) }}
      </h1>

      <p class="text-sm text-aldy-green-gray max-w-sm leading-relaxed NewAldyFontType4">
        {{ isItemDetailLayout ? (collectionItem?.description) : (product?.description) }}
      </p>

      <div class="pt-4 flex gap-4">
        <a
          [routerLink]="backRoute"
          class="px-6 py-3 border border-aldy-green-gray text-xs tracking-widest uppercase hover:bg-aldy-green-gray hover:text-white transition-all duration-300"
        >
          VOLVER
        </a>
      </div>
    </div>

    <!-- IMÁGENES (sticky derecha, scroll strip) -->
    <div class="hero-sticky-right" data-items-collection-hero-media>
      <div class="hero-image-strip" id="hero-image-strip">
        <img
          *ngFor="let img of heroImages; let i = index"
          [src]="img"
          [alt]="'Hero image ' + (i + 1)"
        />
      </div>
    </div>

  </div>
</section>

<!-- GALERÍA -->
<section class="px-6 lg:px-16 w-full pb-20 bg-aldy-white">
  <div class="max-w-[1800px] mx-auto">

    <div class="mb-6 pt-16">
      <h2 class="text-xl tracking-widest NewAldyTitle text-aldy-green-gray-bold">
        GALERÍA
      </h2>
      <p class="text-xs text-aldy-green-gray NewAldyFontType4 mt-1">
        Click en una imagen o video
      </p>
    </div>

    <!-- Galería personalizada con 4 imágenes por fila -->
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mb-8">
      <div
        *ngFor="let item of galleryMedia; let i = index"
        class="gallery-card relative aspect-square overflow-hidden cursor-pointer group"
        (click)="openIndex = i">

        <img
          *ngIf="item.type === 'image'"
          [src]="item.url"
          [alt]="item.alt"
          class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110">

        <video
          *ngIf="item.type === 'video'"
          [src]="item.url"
          [poster]="item.poster"
          class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110"
          muted
          loop>
        </video>

        <!-- Overlay para videos -->
        <div
          *ngIf="item.type === 'video'"
          class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-20 transition-all duration-300 flex items-center justify-center">
          <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
            <svg class="w-6 h-6 text-gray-800 ml-1" fill="currentColor" viewBox="0 0 20 20">
              <path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"/>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!--  NO TOCAR: este mantiene el lightbox -->
    <app-gen-gallery-vanilla
      [media]="galleryMedia"
      [openIndex]="openIndex">
    </app-gen-gallery-vanilla>

  </div>
</section>
