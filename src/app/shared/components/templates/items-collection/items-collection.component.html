<div class="h-[0px] lg:h-[88px]"></div>
<section>
  <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>
</section>

<section class="w-full bg-aldy-white">
  <div class="w-full max-w-[1700px] mx-auto px-6 grid grid-cols-1 lg:grid-cols-2 gap-10 items-start py-10 md:py-16">

    <!-- TEXTO IZQUIERDA -->
    <div class="space-y-6">
      <p class="text-xs uppercase tracking-[0.3em] text-aldy-green-gray NewAldyFontType4">
        {{ sectionLabel }}
      </p>

      <h1 class="text-5xl lg:text-7xl NewAldyTitle text-aldy-green-gray-bold font-light">
        {{ isItemDetailLayout ? (collectionItem?.title) : (product?.name) }}
      </h1>

      <p class="text-sm max-w-md text-aldy-green-gray NewAldyFontType4 leading-relaxed">
        {{ isItemDetailLayout ? (collectionItem?.description) : (product?.description) }}
      </p>

      <div class="flex items-center gap-6 pt-2">
        <a
          [routerLink]="backRoute"
          class="border border-aldy-green-gray px-6 py-3 text-xs uppercase tracking-widest NewAldyTitle hover:bg-aldy-green-gray hover:text-white transition"
        >
          VOLVER A LA COLECCIÓN
        </a>
      </div>
    </div>

    <!-- HERO MEDIA DERECHA -->
    <div class="relative w-full overflow-hidden" data-items-collection-hero-media>
      <div class="aspect-[4/5] w-full bg-black/5 overflow-hidden">
        <img
          *ngIf="isItemDetailLayout ? (collectionItem?.heroImage) : (product?.main_image)"
          [src]="isItemDetailLayout ? (collectionItem?.heroImage) : (product?.main_image)"
          [alt]="isItemDetailLayout ? (collectionItem?.title || 'Item') : (product?.name || 'Producto')"
          class="w-full h-full object-cover"
        />
      </div>
    </div>

  </div>
</section>

<!-- GALERÍA -->
<section class="px-4 sm:px-6 lg:px-12 xl:px-16 2xl:px-24 w-full pb-12">
  <div class="max-w-screen-3xl mx-auto">
    <div class="mb-4">
      <h2 class="text-md sm:text-xl font-light text-aldy-green-gray-bold NewAldyTitle tracking-wider">
        GALERÍA
      </h2>
      <p class="text-xs NewAldyFontType4 text-aldy-green-gray mt-1">
        Click en una foto o video para abrir el lightbox.
      </p>
    </div>

    <app-gen-gallery-vanilla [media]="media" [openIndex]="openIndex"></app-gen-gallery-vanilla>
  </div>
</section>
