<div class="relative group/carousel w-full">
  <!-- Contenedor del Carrusel con Scroll Snap -->
  <div
    #sliderRef
    class="keen-slider w-full flex overflow-x-auto snap-x snap-mandatory scroll-smooth scrollbar-none py-1"
    [style.gap.px]="currentSpacing"
  >
    <div
      *ngFor="let img of images; let i = index"
      class="keen-slider__slide snap-start flex-shrink-0 relative cursor-pointer overflow-hidden rounded-md"
      [style.width]="getSlideWidth()"
      (click)="imageClick.emit(img)"
    >
      <div class="relative w-full h-0" [style.paddingBottom]="getPaddingBottom()">
        <img
          [src]="img.image_url || img"
          [appCardInitAnimation]="'up'"
          [animationDelay]="i * 0.3"
          alt="carousel"
          class="absolute inset-0 w-full h-full object-cover object-center transition-transform duration-500 hover:scale-105"
          draggable="false"
        />

        <div
          *ngIf="hoverOverlay"
          class="absolute inset-0 bg-black/40 opacity-0 hover:opacity-100 transition-opacity duration-300 ease-in-out flex items-center justify-center"
        >
          <i [class]="hoverIconClass + ' text-white text-3xl'"></i>
        </div>
      </div>
    </div>
  </div>

  <!-- Botones de Navegación (Opcionales / Hover) -->
  <button
    *ngIf="images.length > currentPerView"
    type="button"
    aria-label="Anterior"
    (click)="scrollPrev()"
    class="absolute left-2 top-1/2 -translate-y-1/2 z-10 w-9 h-9 rounded-full bg-white/80 hover:bg-white text-gray-800 shadow-md opacity-0 group-hover/carousel:opacity-100 transition-all flex items-center justify-center cursor-pointer"
  >
    <i class="fa-solid fa-chevron-left text-sm"></i>
  </button>

  <button
    *ngIf="images.length > currentPerView"
    type="button"
    aria-label="Siguiente"
    (click)="scrollNext()"
    class="absolute right-2 top-1/2 -translate-y-1/2 z-10 w-9 h-9 rounded-full bg-white/80 hover:bg-white text-gray-800 shadow-md opacity-0 group-hover/carousel:opacity-100 transition-all flex items-center justify-center cursor-pointer"
  >
    <i class="fa-solid fa-chevron-right text-sm"></i>
  </button>
</div>
