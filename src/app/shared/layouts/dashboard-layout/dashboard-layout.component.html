<div class="min-h-screen bg-gray-50 flex">
  <!-- Sidebar -->
  <div class="sidebar bg-white shadow-lg w-64 min-h-screen" [class.sidebar-collapsed]="!sidebarOpen">
    <!-- Logo/Header -->
    <div class="p-6 border-b border-gray-200">
      <h2 class="text-xl font-bold text-gray-800">Admin Panel</h2>
      <p class="text-sm text-gray-500">{{ currentUser?.email }}</p>
    </div>

    <!-- Navigation Menu -->
    <nav class="mt-6">
      <div class="px-4 space-y-2">
        @for (item of menuItems; track item) {
          <a
            [routerLink]="item.route"
            (click)="setActiveMenuItem(item.route)"
            class="flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-blue-50 hover:text-blue-600 transition-colors duration-200"
            [class.bg-blue-50]="item.active"
            [class.text-blue-600]="item.active"
            [class.border-r-2]="item.active"
            [class.border-blue-600]="item.active">
            <i [class]="item.icon" class="w-5 h-5 mr-3"></i>
            <span class="font-medium">{{ item.label }}</span>
          </a>
        }
      </div>
    </nav>

    <!-- Logout Button -->
    <div class="absolute bottom-0 w-64 p-4 border-t border-gray-200">
      <button
        (click)="logout()"
        class="flex items-center w-full px-4 py-3 text-gray-700 rounded-lg hover:bg-red-50 hover:text-red-600 transition-colors duration-200">
        <i class="fas fa-sign-out-alt w-5 h-5 mr-3"></i>
        <span class="font-medium">Cerrar Sesión</span>
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col">
    <!-- Top Header -->
    <header class="bg-white shadow-sm border-b border-gray-200 px-6 py-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center">
          <button
            (click)="toggleSidebar()"
            class="p-2 rounded-md text-gray-500 hover:text-gray-700 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 lg:hidden">
            <i class="fas fa-bars w-5 h-5"></i>
          </button>
          <h1 class="ml-4 text-2xl font-semibold text-gray-900">Dashboard</h1>
        </div>

        <div class="flex items-center space-x-4">
          <div class="relative">
            <button class="p-2 rounded-full text-gray-500 hover:text-gray-700 hover:bg-gray-100">
              <i class="fas fa-bell w-5 h-5"></i>
            </button>
            <span class="absolute top-0 right-0 block h-2 w-2 rounded-full bg-red-400"></span>
          </div>

          <div class="flex items-center space-x-3">
            <div class="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center">
              <span class="text-white text-sm font-medium">
                {{ currentUser?.email?.charAt(0)?.toUpperCase() }}
              </span>
            </div>
            <span class="text-sm font-medium text-gray-700">Admin</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="flex-1 p-6 overflow-y-auto">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Mobile Sidebar Overlay -->
  @if (!sidebarOpen) {
    <div
      class="fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden"
      (click)="toggleSidebar()">
    </div>
  }
</div>
