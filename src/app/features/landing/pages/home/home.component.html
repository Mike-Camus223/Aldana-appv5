<section class="w-full overflow-hidden">

  <div class="relative flex items-center justify-center min-h-[180px] sm:min-h-[200px] lg:min-h-[230px] px-3  sm:px-6 py-2 sm:py-8 overflow-hidden">

    <div class="absolute left-1/2 top-8 sm:top-10 lg:top-12 -translate-x-1/2 opacity-30 w-14 sm:w-20 lg:w-24 pointer-events-none select-none">
      <img
        src="../../../../../assets/svg/logo.svg"
        alt="logo"
        class="w-full h-full object-contain"
        draggable="false" />
    </div>

    <div class="relative z-10 flex flex-col items-center text-center pt-16 sm:pt-20 lg:pt-24">

      <p
        appWordReveal
        class="max-w-lg sm:max-w-lg lg:max-w-3xl text-[1.4rem] leading-6  sm:leading-6  lg:leading-8 sm:text-[1.7rem] lg:text-[1.8rem] italic font-light tracking-[0.01em] text-aldy-green-gray-bold NewAldyTitle">

        "Creo con pasi<span class="NewAldyFontTypeAccent relative -top-[1px]">ó</span>n,
        dise<span class="NewAldyFontTypeAccent relative -top-[1px]">ñ</span>o con honestidad
        para que seas tu misma".

      </p>

      <img
        src="../../../../../assets/images/firma2.png"
        alt="firma"
        class="mt-2 sm:mt-6 w-20 sm:w-20 lg:w-28 object-contain opacity-90"
        draggable="false" />

    </div>

  </div>

</section>
