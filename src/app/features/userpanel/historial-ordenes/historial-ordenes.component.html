<div class="min-h-screen bg-gray-50 py-8">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
    
    <!-- Header -->
    <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-bold text-gray-900">Historial de Órdenes</h1>
          <p class="text-gray-600 mt-1">Revisa todas tus compras anteriores</p>
        </div>
        <button 
          (click)="goBackToPanel()"
          class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-md transition-colors duration-200">
          Volver al Panel
        </button>
      </div>
    </div>

    <!-- Loading State -->
    <div *ngIf="loading" class="bg-white rounded-lg shadow-sm p-8 text-center">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
      <p class="text-gray-600">Cargando historial de órdenes...</p>
    </div>

    <!-- Orders List -->
    <div *ngIf="!loading && orders.length > 0" class="space-y-4">
      <div *ngFor="let order of orders" class="bg-white rounded-lg shadow-sm p-6 hover:shadow-md transition-shadow duration-200">
        <div class="flex items-center justify-between mb-4">
          <div>
            <h3 class="text-lg font-semibold text-gray-900">Orden #{{ order.id }}</h3>
            <p class="text-gray-600">{{ order.date | date:'dd/MM/yyyy' }}</p>
          </div>
          <div class="text-right">
            <p class="text-xl font-bold text-gray-900">${{ order.total }}</p>
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
                  [ngClass]="{
                    'bg-green-100 text-green-800': order.status === 'Entregado',
                    'bg-blue-100 text-blue-800': order.status === 'En tránsito',
                    'bg-yellow-100 text-yellow-800': order.status === 'Procesando'
                  }">
              {{ order.status }}
            </span>
          </div>
        </div>
        
        <div class="flex items-center justify-between">
          <p class="text-gray-600">{{ order.items }} artículo(s)</p>
          <button 
            (click)="viewOrderDetails(order.id)"
            class="text-blue-600 hover:text-blue-800 font-medium">
            Ver Detalles
          </button>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="!loading && orders.length === 0" class="bg-white rounded-lg shadow-sm p-8 text-center">
      <svg class="w-16 h-16 text-gray-400 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
      </svg>
      <h3 class="text-lg font-medium text-gray-900 mb-2">No hay órdenes</h3>
      <p class="text-gray-600 mb-4">Aún no has realizado ninguna compra.</p>
      <a routerLink="/tienda" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md transition-colors duration-200">
        Ir a la Tienda
      </a>
    </div>

  </div>
</div>
