<div class="min-h-screen bg-gray-50 flex">
  <!-- Sidebar -->
  <div class="w-64 bg-white shadow-lg">
    <div class="p-6 border-b border-gray-200">
      <h1 class="text-xl font-bold text-gray-900">Panel de Usuario</h1>
      <p class="text-sm text-gray-600 mt-1" *ngIf="currentUser">
        {{ currentUser.email }}
      </p>
    </div>
    
    <nav class="mt-6">
      <div class="px-3 space-y-1">
        <!-- Dashboard -->
        <button 
          (click)="setActiveSection('dashboard')"
          [ngClass]="{
            'bg-blue-100 text-blue-700 border-r-2 border-blue-700': activeSection === 'dashboard',
            'text-gray-700 hover:bg-gray-100': activeSection !== 'dashboard'
          }"
          class="w-full flex items-center px-3 py-2 text-sm font-medium rounded-md transition-colors duration-200">
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2-2z"></path>
          </svg>
          Dashboard
        </button>

        <!-- Historial de Órdenes -->
        <button 
          (click)="setActiveSection('orders')"
          [ngClass]="{
            'bg-blue-100 text-blue-700 border-r-2 border-blue-700': activeSection === 'orders',
            'text-gray-700 hover:bg-gray-100': activeSection !== 'orders'
          }"
          class="w-full flex items-center px-3 py-2 text-sm font-medium rounded-md transition-colors duration-200">
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
          </svg>
          Historial de Órdenes
        </button>

        <!-- Mi Cuenta -->
        <button 
          (click)="setActiveSection('account')"
          [ngClass]="{
            'bg-blue-100 text-blue-700 border-r-2 border-blue-700': activeSection === 'account',
            'text-gray-700 hover:bg-gray-100': activeSection !== 'account'
          }"
          class="w-full flex items-center px-3 py-2 text-sm font-medium rounded-md transition-colors duration-200">
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
          Mi Cuenta
        </button>

        <!-- Eliminar Cuenta -->
        <button 
          (click)="setActiveSection('delete')"
          [ngClass]="{
            'bg-red-100 text-red-700 border-r-2 border-red-700': activeSection === 'delete',
            'text-gray-700 hover:bg-gray-100': activeSection !== 'delete'
          }"
          class="w-full flex items-center px-3 py-2 text-sm font-medium rounded-md transition-colors duration-200">
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
          </svg>
          Eliminar Cuenta
        </button>
      </div>

      <!-- Logout Button -->
      <div class="px-3 mt-8 pt-6 border-t border-gray-200">
        <button 
          (click)="onSignOut()"
          class="w-full flex items-center px-3 py-2 text-sm font-medium text-red-600 hover:bg-red-50 rounded-md transition-colors duration-200">
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
          </svg>
          Cerrar Sesión
        </button>
      </div>
    </nav>
  </div>

  <!-- Main Content -->
  <div class="flex-1 overflow-auto">
    <!-- Dashboard Content -->
    <div *ngIf="activeSection === 'dashboard'" class="p-6">
      <div class="mb-6">
        <h2 class="text-2xl font-bold text-gray-900">Bienvenido al Panel</h2>
        <p class="text-gray-600 mt-1">Gestiona tu cuenta y revisa tu actividad</p>
      </div>

      <!-- Stats Cards -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="bg-white rounded-lg shadow-sm p-6">
          <div class="flex items-center">
            <div class="bg-blue-100 p-3 rounded-full">
              <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
              </svg>
            </div>
            <div class="ml-4">
              <p class="text-sm font-medium text-gray-500">Total Órdenes</p>
              <p class="text-2xl font-semibold text-gray-900">2</p>
            </div>
          </div>
        </div>

        <div class="bg-white rounded-lg shadow-sm p-6">
          <div class="flex items-center">
            <div class="bg-green-100 p-3 rounded-full">
              <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1"></path>
              </svg>
            </div>
            <div class="ml-4">
              <p class="text-sm font-medium text-gray-500">Total Gastado</p>
              <p class="text-2xl font-semibold text-gray-900">$239.49</p>
            </div>
          </div>
        </div>

        <div class="bg-white rounded-lg shadow-sm p-6">
          <div class="flex items-center">
            <div class="bg-purple-100 p-3 rounded-full">
              <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
            </div>
            <div class="ml-4">
              <p class="text-sm font-medium text-gray-500">Cuenta Activa</p>
              <p class="text-2xl font-semibold text-green-600">Verificada</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Account Info -->
      <div class="bg-white rounded-lg shadow-sm p-6" *ngIf="currentUser">
        <h3 class="text-lg font-semibold text-gray-900 mb-4">Información de Cuenta</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">Email</label>
            <p class="mt-1 text-sm text-gray-900">{{ currentUser.email }}</p>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Fecha de Registro</label>
            <p class="mt-1 text-sm text-gray-900">{{ currentUser.created_at | date:'dd/MM/yyyy' }}</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Dynamic Content Area -->
    <div *ngIf="activeSection === 'orders'">
      <router-outlet></router-outlet>
    </div>
    <div *ngIf="activeSection === 'account'">
      <router-outlet></router-outlet>
    </div>
    <div *ngIf="activeSection === 'delete'">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
