<div class="flex items-center justify-center w-full h-screen bg-aldy-bg overflow-hidden">
  <div class="w-full max-w-md mx-auto text-center px-6">
    
    <!-- Icono de éxito -->
    <div class="mb-8">
      <div class="mx-auto w-24 h-24 bg-green-100 rounded-full flex items-center justify-center pulse-icon">
        <i class="fas fa-check-double text-green-500 text-4xl"></i>
      </div>
    </div>

    <!-- Título principal -->
    <h1 class="text-3xl font-bold text-aldy-primary-600 mb-4 fade-in">
      ¡Registro Exitoso!
    </h1>

    <!-- Mensaje descriptivo -->
    <div class="mb-8 space-y-4 fade-in">
      <p class="text-lg text-gray-700 leading-relaxed">
        Tu cuenta ha sido <strong>confirmada exitosamente</strong>.
      </p>
      <p class="text-gray-600">
        Ya puedes acceder a todas las funcionalidades de tu cuenta y realizar compras.
      </p>
    </div>

    <!-- Información adicional -->
    <div class="mb-8 p-4 bg-green-50 border border-green-200 rounded-lg fade-in">
      <div class="flex items-center justify-center space-x-3">
        <i class="fas fa-shield-check text-green-500 text-xl"></i>
        <div>
          <p class="text-sm text-green-800 font-medium">
            ¡Tu cuenta está completamente activa!
          </p>
          <p class="text-xs text-green-600">
            Puedes iniciar sesión y comenzar a usar la aplicación.
          </p>
        </div>
      </div>
    </div>

    <!-- Botón principal para ir al home -->
    <button 
      (click)="goToHome()" 
      class="w-full bg-aldy-primary-600 hover:bg-aldy-primary-700 text-white font-medium py-3 px-6 rounded-lg transition-all duration-200 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-aldy-primary-200 shadow-md mb-4">
      Ir al Inicio
    </button>

    <!-- Botón secundario para login -->
    <button 
      routerLink="/auth/login"
      class="w-full bg-white hover:bg-gray-50 text-aldy-primary-600 font-medium py-3 px-6 rounded-lg border border-aldy-primary-600 transition-all duration-200 ease-in-out focus:outline-none focus:ring-4 focus:ring-aldy-primary-200">
      Iniciar Sesión
    </button>

    <!-- Mensaje adicional -->
    <div class="mt-6">
      <p class="text-sm text-gray-500">
        ¿Necesitas ayuda? 
        <a href="mailto:soporte@aldana.com" class="text-aldy-primary-600 hover:text-aldy-primary-700 font-medium transition-colors">
          Contáctanos
        </a>
      </p>
    </div>

  </div>
</div>
