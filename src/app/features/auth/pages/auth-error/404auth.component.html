<div class="w-full flex flex-col items-center text-center">
  <div class="w-full flex justify-center mb-6">
    <a routerLink="/">
      <img [draggable]="false" src="../../../../../assets/svg/logo-4.svg" alt="Aldana Vilcabana"
        class="h-24 w-auto object-contain" />
    </a>
  </div>
  <div class="mb-7">
    <h1 class="NewAldyTitle text-[72px] leading-none text-aldy-medium-2 mb-2">404</h1>
    <p class="NewAldyFontType4 tracking-[0.28em] uppercase text-[12px] mb-2 text-aldy-green-gray">
      Página no encontrada
    </p>
    <p class="NewAldyFontType4 tracking-wider text-[12.5px] text-[#8A8A7A] max-w-[280px] mx-auto leading-relaxed">
      Ops! algo anda mal.
    </p>
  </div>
  <div class="w-full flex flex-col gap-3.5 mb-8">
    <a routerLink="/cuenta/iniciar-sesion"
      class="w-full py-4 text-center transition focus:outline-none bg-aldy-medium-2 text-white hover:opacity-90">
      <span class="NewAldyFontType4 uppercase text-xs tracking-[0.25em]">
        Iniciar Sesión
      </span>
    </a>
    <a routerLink="/"
      class="w-full py-4 text-center transition focus:outline-none border border-[#C8C4BA] text-[#8A8A7A] hover:bg-[#F5F0EB]">
      <span class="NewAldyFontType4 uppercase text-xs tracking-[0.25em]">
        Ir al Inicio
      </span>
    </a>
  </div>
  <div class="flex items-center gap-4 opacity-50 mb-4">
    <span class="w-8 h-px bg-aldy-medium"></span>
    <img src="../../../../../assets/svg/logos-03.svg" alt="AV" class="w-6 opacity-75">
    <span class="w-8 h-px bg-aldy-medium"></span>
  </div>
</div>
