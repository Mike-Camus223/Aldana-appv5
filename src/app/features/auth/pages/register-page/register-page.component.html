<div class="w-full min-h-screen flex flex-col items-center justify-center sm:py-4 md:px-0">
    <!-- Card con max-width responsive pero que se estira dentro de su contenedor -->
    <div
        class="w-full max-w-[314px] min-[360px]:max-w-xs sm:max-w-sm md:max-w-md lg:max-w-md xl:max-w-md flex flex-col justify-between min-h-screen sm:min-h-0">

        <!-- Contenido principal -->
        <div class="flex-grow flex flex-col justify-center py-4 sm:py-6 md:py-8">
            <!-- Main Card -->
            <div class="w-full">
                <!-- Logo AV -->
                <a routerLink="/home">
                    <div class="flex flex-col items-center text-center justify-center mb-8 sm:mb-6 md:mb-8 lg:mb-10">
                        <h1
                            class="relative aldyFont font-bold text-3xl min-[360px]:text-4xl sm:text-5xl md:text-6xl text-aldy-primary-600">
                            <div class="relative flex justify-center">
                                <span class="relative -mr-0.5 min-[360px]:-mr-1">A</span>
                                <span class="relative -top-[2px] min-[360px]:-top-[3px]">V</span>
                            </div>
                        </h1>
                        <div
                            class="aldyFont font-bold text-xs min-[360px]:text-sm sm:text-base md:text-lg text-gray-700 tracking-wide min-[360px]:tracking-widest uppercase mt-0.5 min-[360px]:mt-1">
                            aldana vilcabana
                        </div>
                    </div>
                </a>

                <!-- Register Form -->
                <div class="mb-4 sm:mb-6 md:mb-8">
                    <h2
                        class="font-semibold aldyFont text-[18px] min-[360px]:text-[18px] sm:text-[20px] tracking-tight text-gray-600 text-left mb-4 sm:mb-6">
                        Crear una Cuenta
                    </h2>
                </div>

                <form class="w-full" [formGroup]="form" (ngSubmit)="onSubmit()">

                    <!-- Nombre y apellido -->
                    <div class="mb-4 min-[360px]:mb-5 sm:mb-6 md:mb-7 grid grid-cols-2 gap-4">
                        <app-input label="Nombre" formControlName="nombre"></app-input>
                        <app-input label="Apellido" formControlName="apellido"></app-input>
                    </div>


                    <!-- Email -->
                    <div class="mb-4 min-[360px]:mb-5 sm:mb-6 md:mb-7">
                        <app-input label="Correo electrónico" formControlName="email"></app-input>
                    </div>

                    <!-- Password -->
                    <div class="mb-3 min-[360px]:mb-3 sm:mb-3 md:mb-3">
                        <app-inputpassword label="Contraseña" formControlName="password"></app-inputpassword>
                        <!-- Error Message debajo del password input -->
                        <p *ngIf="form.get('password')?.touched && form.get('password')?.invalid"
                            class="text-red-500 text-xs min-[360px]:text-sm mt-1.5 min-[360px]:mt-2">
                            {{ passwordErrorMessage }}
                        </p>
                    </div>

                    <!-- Repeat Password -->
                    <div class="mb-3 min-[360px]:mb-3 sm:mb-3 md:mb-3">
                        <app-inputpassword label="Repetir Contraseña"
                            formControlName="repeatPassword"></app-inputpassword>
                        <!-- Error Message debajo del repeat password input -->
                        <p *ngIf="(form.get('repeatPassword')?.touched && form.get('repeatPassword')?.invalid) || (form.errors?.['passwordNotMatch'] && form.get('repeatPassword')?.touched)"
                            class="text-red-500 text-xs min-[360px]:text-sm mt-1.5 min-[360px]:mt-2">
                            {{ repeatPasswordErrorMessage }}
                        </p>
                    </div>

                    <!-- Newsletter Section -->
                    <div class="mb-4 min-[360px]:mb-5 sm:mb-6 md:mb-7">
                        <p class="text-sm min-[360px]:text-base text-gray-700 mb-3">
                            *Quiero ser la primera en recibir las newsletters de aldana vilcabana
                        </p>

                        <!-- Radio buttons for newsletter -->
                        <div class="flex gap-4 mb-4">
                            <label class="flex items-center cursor-pointer">
                                <input type="radio" [value]="true" formControlName="newsletter"
                                    class="w-4 h-4 text-aldy-primary-600 bg-gray-100 border-gray-300 focus:ring-aldy-primary-500 focus:ring-2">
                                <span class="ml-2 text-sm text-gray-700">Sí</span>
                            </label>
                            <label class="flex items-center cursor-pointer">
                                <input type="radio" [value]="false" formControlName="newsletter"
                                    class="w-4 h-4 text-aldy-primary-600 bg-gray-100 border-gray-300 focus:ring-aldy-primary-500 focus:ring-2">
                                <span class="ml-2 text-sm text-gray-700">No</span>
                            </label>
                        </div>
                    </div>

                    <!-- Terms and Conditions Checkbox -->
                    <div class="mb-4 min-[360px]:mb-5 sm:mb-6 md:mb-7">
                        <label class="flex items-start cursor-pointer">
                            <input type="checkbox" formControlName="termsAccepted"
                                class="w-4 h-4 mt-0.5 text-aldy-primary-600 bg-gray-100 border-gray-300 rounded focus:ring-aldy-primary-500 focus:ring-2">
                            <span class="ml-2 text-sm text-gray-700">
                                He leído y acepto explícitamente las
                                <a href="#"
                                    class="text-aldy-primary-600 hover:text-aldy-primary-700 underline">Condiciones
                                    Generales de Venta</a>
                                y la
                                <a href="#" class="text-aldy-primary-600 hover:text-aldy-primary-700 underline">Política
                                    de Privacidad</a>.
                            </span>
                        </label>
                        <p *ngIf="form.get('termsAccepted')?.touched && form.get('termsAccepted')?.invalid"
                            class="text-red-500 text-xs min-[360px]:text-sm mt-1.5">
                            Debes aceptar los términos y condiciones
                        </p>
                    </div>

                    <!-- Submit Button -->
                    <div class="min-[360px] mb-4 min-[360px]:mb-5 sm:mb-6 md:mb-7">
                        <button type="submit" [disabled]="isSubmitting || form.invalid" [ngClass]="{
              'bg-aldy-primary-600 hover:bg-aldy-primary-700 text-aldy-bg cursor-pointer': !(isSubmitting || form.invalid),
              'bg-aldy-primary-400 text-white cursor-not-allowed': (isSubmitting || form.invalid)
            }" class="w-full px-4 min-[360px]:px-5 sm:px-6 py-3 min-[360px]:py-3.5 sm:py-4 text-sm min-[360px]:text-base font-semibold text-center transition duration-200 ease-in-out focus:outline-none focus:ring-4 focus:ring-aldy-primary-200 disabled:opacity-50">
                            {{ isSubmitting ? 'Registrando...' : 'Registrate' }}
                        </button>
                    </div>

                    <!-- Error Message -->
                    <div *ngIf="authError" class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg">
                        <div class="flex items-center">
                            <i class="fas fa-exclamation-triangle text-red-500 mr-2"></i>
                            <p class="text-red-700 text-sm font-medium">{{ authError }}</p>
                        </div>
                    </div>

                    <!-- Login Link -->
                    <div class="items-center flex justify-center gap-2 w-full">
                        <p class="text-[14px] text-aldy-primary-600 text-center">
                            ¿Ya tienes cuenta?
                        </p>
                        <a routerLink="/auth/login"
                            class="text-[14px] font-medium text-aldy-primary-600 hover:text-aldy-primary-700 hover:underline transition-colors duration-300">
                            Inicia sesión aquí
                        </a>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
