<!-- Contenedor principal que ocupa todo el ancho disponible -->
<div class="w-full min-h-screen flex flex-col items-center justify-center sm:py-4 md:px-0">
  <!-- Card con max-width responsive pero que se estira dentro de su contenedor -->
  <div
    class="w-full max-w-[314px] min-[360px]:max-w-xs sm:max-w-sm md:max-w-md lg:max-w-md xl:max-w-md flex flex-col justify-between min-h-screen sm:min-h-0">

    <!-- Contenido principal -->
    <div class="flex-grow flex flex-col justify-center py-4 sm:py-6 md:py-8">
      <!-- Main Card -->
      <div class="w-full">
        <!-- Logo AV -->
        <a routerLink="/home">
          <div class="flex flex-col items-center text-center justify-center mb-8 sm:mb-6 md:mb-8 lg:mb-10">
            <h1
              class="relative aldyFont font-bold text-3xl min-[360px]:text-4xl sm:text-5xl md:text-6xl text-aldy-primary-600">
              <div class="relative flex justify-center">
                <span class="relative -mr-0.5 min-[360px]:-mr-1">A</span>
                <span class="relative -top-[2px] min-[360px]:-top-[3px]">V</span>
              </div>
            </h1>
            <div
              class="aldyFont font-bold text-xs min-[360px]:text-sm sm:text-base md:text-lg text-gray-700 tracking-wide min-[360px]:tracking-widest uppercase mt-0.5 min-[360px]:mt-1">
              aldana vilcabana
            </div>
          </div>
        </a>

        <!-- Login Form -->
        <div class="mb-4 sm:mb-6 md:mb-8">
          <h2
            class="font-semibold aldyFont text-[18px] min-[360px]:text-[18px] sm:text-[20px] tracking-tight text-gray-600 text-left mb-4 sm:mb-6">
            Iniciar Sesión
          </h2>
        </div>

        <form class="w-full" [formGroup]="formLogin" (ngSubmit)="onSubmit()">

          <!-- Email -->
          <div class="mb-4 min-[360px]:mb-5 sm:mb-6 md:mb-7">
            <app-input label="Correo electrónico" formControlName="email"></app-input>
          </div>

          <!-- Password -->
          <div class="mb-3 min-[360px]:mb-3 sm:mb-3 md:mb-3">
            <app-inputpassword label="Contraseña" formControlName="password"></app-inputpassword>
            <!-- Error Message debajo del password input -->
            <p *ngIf="authError" class="text-red-500 text-xs min-[360px]:text-sm mt-1.5 min-[360px]:mt-2">
              {{ authError }}
            </p>
          </div>

          <!-- Remember & Forgot Password -->
          <div
            class="flex flex-col space-y-3 sm:flex-row sm:items-center sm:justify-between sm:space-y-0 pt-1 min-[360px]:pt-2 mb-4 min-[360px]:mb-4 sm:mb-4 md:mb-5">
            <a href="#"
              class="text-[14px] min-[360px] text-aldy-primary-600 hover:text-aldy-primary-700 hover:underline transition-colors duration-200 text-center sm:text-left">
              ¿Olvidaste tu contraseña?
            </a>
          </div>

          <!-- Submit Button -->
          <div class="min-[360px] mb-4 min-[360px]:mb-5 sm:mb-6 md:mb-7">
            <button type="submit" [disabled]="isSubmitting || formLogin.invalid" [ngClass]="{
      'bg-aldy-primary-600 hover:bg-aldy-primary-700 text-aldy-bg cursor-pointer': !(isSubmitting || formLogin.invalid),
      'bg-aldy-primary-400 text-white cursor-not-allowed': (isSubmitting || formLogin.invalid)
    }" class="w-full px-4 min-[360px]:px-5 sm:px-6 py-3 min-[360px]:py-3.5 sm:py-4 text-sm min-[360px]:text-base font-semibold text-center transition duration-200 ease-in-out focus:outline-none focus:ring-4 focus:ring-aldy-primary-200 disabled:opacity-50">
              {{ isSubmitting ? 'Ingresando...' : 'Iniciar Sesión' }}
            </button>
          </div>

          <!-- Register Link -->
          <div class="items-center flex justify-center gap-2 w-full">
            <p class="text-[14px] text-aldy-primary-600 text-center">
              ¿No tenés cuenta aún?
            </p>
            <a routerLink="/register"
              class="text-[14px] font-medium text-aldy-primary-600 hover:text-aldy-primary-700 hover:underline transition-colors duration-300">
              Crear cuenta
            </a>
          </div>

        </form>


        <!-- Divider -->
        <div class="relative my-5 min-[360px]:my-6 sm:my-8">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-300"></div>
          </div>
          <div class="relative flex justify-center text-xs min-[360px]:text-sm sm:text-base">
            <span class="px-3 min-[360px]:px-4 sm:px-6 bg-white text-gray-500">O inicia rápido con</span>
          </div>
        </div>

        <!-- Social Login Section -->
        <div class="mb-6 min-[360px]:mb-8 sm:mb-10">
          <div class="flex justify-center gap-3 min-[360px]:gap-4 sm:gap-6">
            <button type="button"
              class="w-10 h-10 min-[360px]:w-11 min-[360px]:h-11 sm:w-12 sm:h-12 flex items-center justify-center bg-blue-600 border border-blue-600 rounded-full cursor-pointer hover:bg-blue-700 hover:border-blue-700 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-blue-300"
              title="Continuar con Facebook">
              <i class="fab fa-facebook text-white text-base min-[360px]:text-lg sm:text-xl"></i>
            </button>
            <button type="button"
              class="w-10 h-10 min-[360px]:w-11 min-[360px]:h-11 sm:w-12 sm:h-12 flex items-center justify-center bg-red-500 border border-red-500 rounded-full cursor-pointer hover:bg-red-600 hover:border-red-600 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-red-300"
              title="Continuar con Google">
              <i class="fab fa-google text-white text-base min-[360px]:text-lg sm:text-xl"></i>
            </button>
            <button type="button"
              class="w-10 h-10 min-[360px]:w-11 min-[360px]:h-11 sm:w-12 sm:h-12 flex items-center justify-center bg-gray-950 border border-gray-950 rounded-full cursor-pointer hover:bg-gray-800 hover:border-gray-800 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-gray-400"
              title="Continuar con Apple">
              <i class="fab fa-apple text-white text-base min-[360px]:text-lg sm:text-xl"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer que se pega al fondo -->
    <div class="text-center pb-4 min-[360px]:pb-6 sm:pb-8 md:pb-10 flex justify-center mt-4 min-[360px]:mt-6 sm:mt-8">
      <p
        class="text-[10px] min-[360px]:text-xs sm:text-xs text-gray-400 max-w-[250px] min-[360px]:max-w-xs sm:max-w-sm leading-relaxed px-2 min-[360px]:px-0">
        Al iniciar sesión, aceptas nuestras
        <a href="#" class="hover:text-gray-600 transition-colors underline">Políticas de Privacidad</a> y
        <a href="#" class="hover:text-gray-600 transition-colors underline">Términos de Servicio</a>.
      </p>
    </div>
  </div>
</div>
