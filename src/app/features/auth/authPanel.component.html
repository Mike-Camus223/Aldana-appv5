<!-- Layout principal dividido en 2 partes (40% y 60%) -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-[6fr_4fr] w-full lg:h-screen">
    <!-- Lado derecho - Imagen (60%) -->
    <div class="relative hidden md:block h-full w-full overflow-hidden">
      <img [draggable]="false"
           src="https://cddrmboopihkiuyomxle.supabase.co/storage/v1/object/public/aldana-app/multimedia/about%20me/section-photos/preview/preview_6.jpg"
           alt="Login background"
           class="w-full h-full object-cover object-top-left xl:[clip-path:circle(70%_at_20%_50%)] lg:[clip-path:circle(70%_at_8%_50%)]" />
    </div>
    
    <!-- Lado izquierdo - Formulario (40%) -->
    <div class="h-auto lg:h-full overflow-x-hidden px-4 sm:px-8 lg:px-5 xl:px-6">
      <div class="w-full flex justify-center md:justify-start max-w-full">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
  <app-newsletter></app-newsletter>
  <app-footerv2></app-footerv2>
