<div class="h-[72px] lg:h-[88px]"></div>
<app-navbar-publicv3></app-navbar-publicv3>
<div class="px-4 sm:px-6 lg:px-12 bg-aldy-white xl:px-16 2xl:px-24 w-full">
  <div class="max-w-7xl mx-auto">
    <div
      class="min-w-auto sm:min-h-[90vh] h-full w-full flex flex-col md:flex-row justify-center gap-6"
      *ngIf="cartItems.length > 0; else emptyCart"
    >
      <div class="w-full md:w-2xl justify-center flex">
        <div class="relative w-full p-4 md:p-8">
          <div
            class="flex border-b border-[#d9e2d8] justify-between items-center w-full py-3"
          >
            <span
              class="text-xs uppercase tracking-wider text-aldy-green-gray NewAldyFontType4"
            >
              Carrito ({{ getTotalItems() }})
            </span>
            <button
              (click)="goToReturn()"
              class="py-2 px-4 border border-aldy-medium text-aldy-medium font-light hover:border-aldy-medium-2 hover:text-aldy-medium-2 NewAldyFontType4 cursor-pointer transition-colors text-sm tracking-wider"
            >
              Continuar comprando
            </button>
          </div>
          <div
            *ngIf="isUpdating && !isClearingCart"
            class="w-full flex justify-center items-center py-20"
          >
            <div class="spinner"></div>
          </div>
          <div
            *ngIf="!isUpdating || isClearingCart"
            [class.fade-up]="animateList"
            [class.fade-out]="!animateList"
            class="transition-all duration-500"
          >
            <ng-container *ngFor="let item of cartItems">
              <div class="fade-item flex gap-0 px-2 py-5 border-b border-[#d9e2d8]">
                <div class="flex gap-3 sm:gap-4 w-full">
                  <img
                    draggable="false"
                    [src]="item.variantMainImage || item.image"
                    alt="Producto"
                    class="w-20 min-w-[60px] max-w-[60px] h-full object-cover"
                  />
                  <div class="flex flex-col justify-between w-full">
                    <div>
                      <h3
                        class="text-xs sm:text-base NewAldyTitle tracking-wider font-light uppercase text-aldy-green-gray-bold"
                      >
                        {{ item.name }}
                      </h3>
    
                      <p
                        class="text-[11px] sm:text-sm text-aldy-green-gray NewAldyFontType4 mt-1 flex items-center gap-2"
                      >
                        Color:
                        <span
                          class="inline-block w-3 h-3 rounded-xs ring-2 ring-aldy-green-gray"
                          [ngStyle]="{ 'background-color': item.color }"
                        ></span>
                      </p>
    
                      <p
                        class="text-[11px] sm:text-sm text-aldy-green-gray flex items-center gap-2 NewAldyFontType4 mt-1"
                      >
                        Talle:
                        <span
                          class="bg-gray-100 px-2 py-0.5 text-[10px] NewAldyFontType4"
                        >
                          {{ item.size }}
                        </span>
                      </p>
                    </div>
                    <h3
                      class="mt-2 text-sm font-light uppercase tracking-wider text-aldy-green-gray NewAldyFontType4"
                    >
                      {{
                        item.price
                          | currency : "ARS" : "symbol-narrow" : "1.2-2" : "es-AR"
                      }}
                    </h3>
                  </div>
                  <div class="ml-auto flex flex-col items-end gap-3">
                    <div class="relative group">
                      <select
                        class="appearance-none border border-aldy-medium py-1 pl-2 pr-6 text-sm text-aldy-green-gray NewAldyFontType4 focus:outline-none cursor-pointer tracking-wider"
                        [ngModel]="item.quantity"
                        (ngModelChange)="onSelectQuantity(item.id, $event)"
                      >
                        <option *ngFor="let qty of [1, 2, 3, 4, 5]" [value]="qty">
                          {{ qty }}
                        </option>
                      </select>
    
                      <i
                        class="fa-solid fa-chevron-down absolute right-2 top-1/2 -translate-y-1/2 text-aldy-green-gray text-[10px] opacity-70 pointer-events-none transition-all duration-200"
                      ></i>
                    </div>
    
                    <button
                      (click)="removeItem(item.id)"
                      class="text-xs text-aldy-green-gray tracking-wider NewAldyFontType4 cursor-pointer"
                    >
                      Borrar
                    </button>
                  </div>
                </div>
              </div>
            </ng-container>
          </div>
          <div
            class="mt-5 flex items-center font-light tracking-wider justify-end gap-2 text-xs NewAldyFontType4 text-aldy-green-gray cursor-pointer"
            (click)="clearCart()"
          >
            Vaciar carrito
          </div>
        </div>
      </div>
      <div class="w-full md:w-1/4 p-3 py-5">
        <div
          class="flex py-2 mb-4 border-b font-light border-[#d9e2d8] justify-between relative h-[40px]"
        >
          <span
            class="text-xs uppercase NewAldyFontType4 tracking-wider text-aldy-green-gray"
          >
            Subtotal
          </span>
    
          <div
            *ngIf="isUpdating"
            class="absolute right-0 top-1/2 -translate-y-1/2 w-full flex justify-end"
          >
            <div class="loader"></div>
          </div>
    
          <span
            *ngIf="!isUpdating"
            class="text-sm NewAldyFontType4 tracking-wider text-aldy-green-gray"
          >
            {{
              getSubtotal() | currency : "ARS" : "symbol-narrow" : "1.2-2" : "es-AR"
            }}
          </span>
        </div>
    
        <button
          (click)="goToShipping()"
          class="w-full cursor-pointer mb-3 py-3 bg-aldy-medium hover:bg-aldy-medium-2 NewAldyFontType4 text-white font-light transition-colors text-sm tracking-wider"
        >
          Continuar al checkout
        </button>
      </div>
    </div>
    <ng-template #emptyCart>
      <div *ngIf="isUpdating" class="h-[90vh]"></div>
      <div
        *ngIf="!isUpdating"
        [class.fade-start]="!animateEmpty"
        [class.fade-up-slow]="animateEmpty"
        class="empty-wrapper py-20"
      >
        <p
          class="tracking-wider NewAldyFontType4 text-sm font-bold text-aldy-green-gray"
        >
          Tu carrito está vacío
        </p>
        <button
          (click)="goToReturn()"
          class="cursor-pointer tracking-wider NewAldyFontType4 text-sm font-light flex items-center justify-center gap-3 bg-aldy-medium border border-aldy-medium text-white uppercase py-3 px-6 transition-colors hover:bg-aldy-medium-2"
        >
          Seguir comprando
        </button>
      </div>
    </ng-template>
  </div>
</div>
